<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Editor Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  const api = window.app;
  const extId = extension.id;

  // ── V2 Tile Runtime ──
  // Initialize tile — validates capability token with main process
  await api.initialize();

  // Initialize extension (registers commands, subscribes to editor:*)
  if (extension.init) {
    await extension.init();
  }

  // Register shutdown handler
  api.onShutdown(() => {
    if (extension.uninit) {
      extension.uninit();
    }
  });
</script>
</body>
</html>
