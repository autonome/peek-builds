<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Lists Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  const api = window.app;
  const extId = extension.id;

  console.log(`[ext:${extId}] background.html loaded`);

  // Validate token and initialize tile runtime before registering anything
  await api.initialize();

  // Initialize extension BEFORE publishing ext:ready
  // (commands must be registered before lazy stub re-publishes)
  if (extension.init) {
    console.log(`[ext:${extId}] calling init()`);
    await extension.init();
  }

  // Signal ready to main process
  api.pubsub.publish('ext:ready', {
    id: extId,
    manifest: {
      id: extension.id,
      labels: extension.labels,
      version: '1.0.0'
    }
  }, api.scopes.SYSTEM);

  // Handle shutdown request from main process
  api.onShutdown(() => {
    console.log(`[ext:${extId}] received shutdown`);
    if (extension.uninit) {
      extension.uninit();
    }
  });

  // Handle app shutdown (pubsub path for cross-tile coordination)
  api.pubsub.subscribe('app:shutdown', () => {
    console.log(`[ext:${extId}] received app:shutdown`);
    if (extension.uninit) {
      extension.uninit();
    }
  }, api.scopes.SYSTEM);

  // Handle extension-specific shutdown
  api.pubsub.subscribe(`ext:${extId}:shutdown`, () => {
    console.log(`[ext:${extId}] received extension shutdown`);
    if (extension.uninit) {
      extension.uninit();
    }
  }, api.scopes.SYSTEM);
</script>
</body>
</html>
