<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Debug</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  const api = window.app;
  const extId = extension.id;

  console.log(`[ext:${extId}] initializing tile`);
  await api.initialize();

  if (extension.init) {
    await extension.init();
  }

  api.onShutdown(() => {
    if (extension.uninit) {
      extension.uninit();
    }
  });
</script>
</body>
</html>
