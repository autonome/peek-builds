<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Hello World Background</title>
</head>
<body>
<script type="module">
  const api = window.app;
  const extId = 'hello-world';

  console.log('[hello-world:bg] background.html loaded');
  console.log('[hello-world:bg] api present:', !!api);
  console.log('[hello-world:bg] api.initialize is function:', typeof api?.initialize);

  if (api && typeof api.initialize === 'function') {
    console.log('[hello-world:bg] calling api.initialize()...');
    try {
      const result = await api.initialize();
      console.log('[hello-world:bg] initialize resolved:', result);
    } catch (err) {
      console.error('[hello-world:bg] initialize threw:', err);
    }
  } else {
    console.warn('[hello-world:bg] no api.initialize — running under legacy preload?');
  }

  console.log('[hello-world:bg] ready — invoke `hello` command to open trace window');

  // Handle the `hello` command: open the trace window, return a result so
  // the cmd panel spinner resolves (declarative `type: window` actions
  // don't publish `:result`, leaving the spinner hanging).
  if (api?.pubsub?.subscribe) {
    api.pubsub.subscribe('cmd:execute:hello', async (msg) => {
      const resultTopic = msg?.resultTopic;
      try {
        await api.window.open('peek://ext/hello-world/home.html', {
          width: 700, height: 900, title: 'Hello World Trace',
        });
        if (resultTopic && api.pubsub?.publish) {
          api.pubsub.publish(resultTopic, { success: true }, api.scopes?.GLOBAL);
        }
      } catch (err) {
        console.error('[hello-world:bg] failed to open trace window:', err);
        if (resultTopic && api.pubsub?.publish) {
          api.pubsub.publish(resultTopic, { success: false, error: String(err?.message || err) }, api.scopes?.GLOBAL);
        }
      }
    }, api.scopes?.GLOBAL);
  }

  if (api && typeof api.onShutdown === 'function') {
    api.onShutdown(() => {
      console.log(`[hello-world:bg] shutdown received`);
    });
  }
</script>
</body>
</html>
