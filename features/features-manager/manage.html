<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Features</title>
    <link rel="stylesheet" type="text/css" href="manage.css">
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <h1 class="header-title">Features</h1>
        <span class="feature-count"></span>
      </div>
      <div class="header-right">
        <button class="btn" id="check-updates-btn" disabled title="Check for updates (coming soon)">
          Check for Updates
        </button>
      </div>
    </header>

    <div class="install-bar">
      <input
        class="install-input"
        placeholder="at://did:plc:.../space.peek.feature.release/..."
        type="text"
        id="install-uri-input"
      >
      <button class="btn primary" id="install-btn">Install</button>
    </div>

    <div class="install-preview" id="install-preview" style="display:none;">
      <div class="install-preview-header">
        <h2 class="install-preview-title" id="preview-title">Feature Name</h2>
        <button class="action-btn" id="preview-close">Cancel</button>
      </div>
      <div class="install-preview-body">
        <div class="preview-meta" id="preview-meta"></div>
        <div class="preview-capabilities" id="preview-capabilities"></div>
      </div>
      <div class="install-preview-footer">
        <button class="btn" id="preview-cancel">Cancel</button>
        <button class="btn primary" id="preview-install">Install</button>
      </div>
    </div>

    <div class="install-status" id="install-status" style="display:none;">
      <span class="install-status-text" id="install-status-text"></span>
    </div>

    <div class="search-container">
      <input
        class="search-input"
        placeholder="Filter installed features..."
        type="search"
        id="search-input"
      >
    </div>

    <div class="content" id="content">
      <div class="loading">Loading features...</div>
    </div>

    <script>
      // V2 tile runtime compat shims
      (function() {
        const api = window.app;
        if (!api) return;
        const isTileV2 = typeof api.initialize === 'function';
        if (!isTileV2) return;
        if (api.pubsub && !api.publish) {
          api.publish = api.pubsub.publish;
          api.subscribe = api.pubsub.subscribe;
        }
        if (api.settings && !api.settings.getExtKey) {
          api.settings.getExtKey = (extId, key) => api.settings.get(extId + '.' + key);
        }
      })();
    </script>
    <script type="module" src="manage.js"></script>
  </body>
</html>
