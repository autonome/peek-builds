<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Search Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  // Feature detection - check if Peek API is available
  const hasPeekAPI = typeof window.app !== 'undefined';
  const api = hasPeekAPI ? window.app : null;
  const extId = extension.id;

  console.log(`[ext:${extId}] background.html loaded`);
  console.log(`[ext:${extId}] Peek API available:`, hasPeekAPI);

  // Detect v2 tile runtime (has api.initialize) vs v1 legacy
  const isTileV2 = hasPeekAPI && typeof api.initialize === 'function';

  if (hasPeekAPI && isTileV2) {
    // ── V2 Tile Runtime ──
    // Shim flat pubsub methods so existing code keeps working.
    if (api.pubsub && !api.publish) {
      api.publish = api.pubsub.publish;
      api.subscribe = api.pubsub.subscribe;
    }

    if (api.settings && !api.settings.getExtKey) {
      api.settings.getExtKey = (extId, key) => api.settings.get(`${extId}.${key}`);
    }

    console.log(`[ext:${extId}] initializing v2 tile`);
    await api.initialize();

    if (extension.init) {
      await extension.init();
    }

    api.onShutdown(() => {
      if (extension.uninit) {
        extension.uninit();
      }
    });

  } else if (hasPeekAPI) {
    // ── V1 Legacy Runtime ──
    // Initialize extension BEFORE signaling ready
    // (lazy loading waits for ext:ready, so handlers must be registered first)
    if (extension.init) {
      await extension.init();
    }

    // Collect registered command topics for assertion verification
    const registeredTopics = Object.keys(window._cmdHandlers || {})
      .map(name => `cmd:execute:${name}`);

    // Signal ready to main process
    api.publish('ext:ready', {
      id: extId,
      registeredTopics,
      manifest: {
        id: extension.id,
        version: '1.0.0'
      }
    }, api.scopes.SYSTEM);

    // Handle shutdown request from main process
    api.subscribe('app:shutdown', () => {
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);

    // Handle extension-specific shutdown
    api.subscribe(`ext:${extId}:shutdown`, () => {
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);
  }
</script>
</body>
</html>
