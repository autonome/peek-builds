<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; connect-src https: http:;">
  <title>Lexicon Studio Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  // Feature detection - check if Peek API is available
  const hasPeekAPI = typeof window.app !== 'undefined';
  const api = hasPeekAPI ? window.app : null;
  const extId = extension.id;

  console.log(`[ext:${extId}] background.html loaded`);
  console.log(`[ext:${extId}] Peek API available:`, hasPeekAPI);

  // Detect v2 tile runtime (has api.initialize) vs v1 legacy
  const isTileV2 = hasPeekAPI && typeof api.initialize === 'function';

  if (hasPeekAPI && isTileV2) {
    // ── V2 Tile Runtime ──
    // Shim flat pubsub methods so existing code keeps working.
    if (api.pubsub && !api.publish) {
      api.publish = api.pubsub.publish;
      api.subscribe = api.pubsub.subscribe;
    }

    // Shim settings.getExtKey if missing (v2 only has get/set)
    if (api.settings && !api.settings.getExtKey) {
      api.settings.getExtKey = (extId, key) => api.settings.get(`${extId}.${key}`);
    }
    // Shim settings.getKey/setKey — used by lex for session/profile/lexiconDirectory
    if (api.settings && !api.settings.getKey) {
      api.settings.getKey = (key) => api.settings.get(key);
    }
    if (api.settings && !api.settings.setKey) {
      api.settings.setKey = (key, value) => api.settings.set(key, value);
    }

    console.log(`[ext:${extId}] initializing v2 tile`);
    await api.initialize();

    if (extension.init) {
      console.log(`[ext:${extId}] calling init()`);
      await extension.init();
    }

    api.onShutdown(() => {
      console.log(`[ext:${extId}] received shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    });

  } else if (hasPeekAPI) {
    // ── V1 Legacy Runtime ──
    if (extension.init) {
      console.log(`[ext:${extId}] calling init()`);
      await extension.init();
    }

    // Collect registered command topics for assertion verification
    const registeredTopics = Object.keys(window._cmdHandlers || {})
      .map(name => `cmd:execute:${name}`);

    // Signal ready to main process (after init so noun handlers are registered)
    api.publish('ext:ready', {
      id: extId,
      registeredTopics,
      manifest: {
        id: extension.id,
        labels: extension.labels,
        version: '1.0.0'
      }
    }, api.scopes.SYSTEM);

    // Handle shutdown request from main process
    api.subscribe('app:shutdown', () => {
      console.log(`[ext:${extId}] received shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);

    // Handle extension-specific shutdown
    api.subscribe(`ext:${extId}:shutdown`, () => {
      console.log(`[ext:${extId}] received extension shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);
  }
</script>
</body>
</html>
