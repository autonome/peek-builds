<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; worker-src blob:;">
  <title>Entities Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  const hasPeekAPI = typeof window.app !== 'undefined';
  const api = hasPeekAPI ? window.app : null;
  const extId = extension.id;

  console.log(`[ext:${extId}] background.html loaded`);

  // Detect v2 tile runtime (has api.initialize) vs v1 legacy
  const isTileV2 = hasPeekAPI && typeof api.initialize === 'function';

  if (hasPeekAPI && isTileV2) {
    // ── V2 Tile Runtime ──
    // Strict mode: background.js uses api.pubsub.* / api.context.* directly.
    // No v1 flat-API shims required.
    console.log(`[ext:${extId}] initializing v2 tile`);
    await api.initialize();

    // Initialize extension BEFORE signaling ready
    if (extension.init) {
      console.log(`[ext:${extId}] calling init()`);
      await extension.init();
    }

    api.onShutdown(() => {
      console.log(`[ext:${extId}] received shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    });

  } else if (hasPeekAPI) {
    // ── V1 Legacy Runtime ──
    // Initialize extension BEFORE publishing ext:ready
    // (commands must be registered before lazy stub re-publishes)
    if (extension.init) {
      console.log(`[ext:${extId}] calling init()`);
      await extension.init();
    }

    // Signal ready to main process
    api.publish('ext:ready', {
      id: extId,
      manifest: {
        id: extension.id,
        labels: extension.labels,
        version: '1.0.0'
      }
    }, api.scopes.SYSTEM);

    // Handle shutdown request from main process
    api.subscribe('app:shutdown', () => {
      console.log(`[ext:${extId}] received shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);

    // Handle extension-specific shutdown
    api.subscribe(`ext:${extId}:shutdown`, () => {
      console.log(`[ext:${extId}] received extension shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);
  }
</script>
</body>
</html>
