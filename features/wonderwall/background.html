<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; connect-src https: http:;">
  <title>Wonderwall Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  // Feature detection - check if Peek API is available
  const hasPeekAPI = typeof window.app !== 'undefined';
  const api = hasPeekAPI ? window.app : null;
  const extId = extension.id;

  console.log(`[ext:${extId}] background.html loaded`);
  console.log(`[ext:${extId}] Peek API available:`, hasPeekAPI);

  if (hasPeekAPI) {
    // Initialize extension
    if (extension.init) {
      console.log(`[ext:${extId}] calling init()`);
      await extension.init();
    }

    // Collect registered command topics for assertion verification
    const registeredTopics = Object.keys(window._cmdHandlers || {})
      .map(name => `cmd:execute:${name}`);

    // Signal ready to main process (after init so handlers are registered)
    api.publish('ext:ready', {
      id: extId,
      registeredTopics,
      manifest: {
        id: extension.id,
        labels: extension.labels,
        version: '1.0.0'
      }
    }, api.scopes.SYSTEM);

    // Handle shutdown request from main process
    api.subscribe('app:shutdown', () => {
      console.log(`[ext:${extId}] received shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);

    // Handle extension-specific shutdown
    api.subscribe(`ext:${extId}:shutdown`, () => {
      console.log(`[ext:${extId}] received extension shutdown`);
      if (extension.uninit) {
        extension.uninit();
      }
    }, api.scopes.SYSTEM);
  }
</script>
</body>
</html>
