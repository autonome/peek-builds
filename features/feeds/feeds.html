<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Feed Reader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary, #1a1a1a);
      color: var(--text-primary, #e0e0e0);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary, #252525);
      border-bottom: 1px solid var(--border, #333);
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      flex: 1;
    }

    .btn {
      background: var(--bg-tertiary, #333);
      border: 1px solid var(--border, #444);
      color: var(--text-primary, #e0e0e0);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn:hover {
      background: var(--bg-hover, #3a3a3a);
    }

    .btn-primary {
      background: var(--accent, #4a9eff);
      border-color: var(--accent, #4a9eff);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover, #3a8eef);
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      background: var(--bg-secondary, #252525);
      border-right: 1px solid var(--border, #333);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border, #333);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary, #888);
    }

    .feed-list {
      flex: 1;
      overflow-y: auto;
    }

    .feed-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border, #2a2a2a);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feed-item:hover {
      background: var(--bg-hover, #2a2a2a);
    }

    .feed-item.active {
      background: var(--bg-active, #333);
    }

    .feed-item .name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feed-item .delete {
      opacity: 0;
      color: var(--text-secondary, #888);
      font-size: 16px;
    }

    .feed-item:hover .delete {
      opacity: 1;
    }

    .all-feeds {
      font-weight: 500;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .entries {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .entry {
      padding: 12px;
      margin-bottom: 8px;
      background: var(--bg-secondary, #252525);
      border-radius: 6px;
      border: 1px solid var(--border, #333);
    }

    .entry:hover {
      border-color: var(--border-hover, #444);
    }

    .entry-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .entry-title a {
      color: var(--text-primary, #e0e0e0);
      text-decoration: none;
    }

    .entry-title a:hover {
      color: var(--accent, #4a9eff);
    }

    .entry-meta {
      font-size: 12px;
      color: var(--text-secondary, #888);
      margin-bottom: 6px;
    }

    .entry-description {
      font-size: 13px;
      color: var(--text-secondary, #aaa);
      line-height: 1.4;
      max-height: 60px;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary, #888);
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 16px;
    }

    .subscribe-form {
      padding: 12px;
      border-top: 1px solid var(--border, #333);
    }

    .subscribe-form input {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-primary, #1a1a1a);
      border: 1px solid var(--border, #444);
      border-radius: 4px;
      color: var(--text-primary, #e0e0e0);
      font-size: 13px;
    }

    .subscribe-form input:focus {
      outline: none;
      border-color: var(--accent, #4a9eff);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary, #888);
    }
  </style>
</head>
<body>
  <header>
    <h1>Feed Reader</h1>
    <button class="btn" id="refreshBtn">Refresh All</button>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">Feeds</div>
      <div class="feed-list" id="feedList">
        <div class="feed-item all-feeds active" data-feed-id="">
          <span class="name">All Feeds</span>
        </div>
      </div>
      <div class="subscribe-form">
        <input type="url" id="subscribeInput" placeholder="Enter feed URL..." />
      </div>
    </div>

    <div class="main">
      <div class="entries" id="entries">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getFeeds, getEntries, subscribeFeed, unsubscribeFeed, pollAllFeeds } from './background.js';

    const api = window.app;

    // V2 tile runtime shims
    if (api && typeof api.initialize === 'function') {
      if (api.pubsub && !api.publish) {
        api.publish = api.pubsub.publish;
        api.subscribe = api.pubsub.subscribe;
      }
    }

    let currentFeedId = null;

    // ==================== Rendering ====================

    async function renderFeeds() {
      const feeds = await getFeeds();
      const feedList = document.getElementById('feedList');

      // Keep the "All Feeds" item
      const allFeedsItem = feedList.querySelector('.all-feeds');

      feedList.innerHTML = '';
      feedList.appendChild(allFeedsItem);

      for (const feed of feeds) {
        const item = document.createElement('div');
        item.className = 'feed-item' + (currentFeedId === feed.id ? ' active' : '');
        item.dataset.feedId = feed.id;
        item.innerHTML = `
          <span class="name" title="${feed.url}">${feed.name}</span>
          <span class="delete" title="Unsubscribe">&times;</span>
        `;
        feedList.appendChild(item);
      }
    }

    async function renderEntries() {
      const entries = await getEntries(currentFeedId, 100);
      const container = document.getElementById('entries');

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No entries yet</h2>
            <p>${currentFeedId ? 'This feed has no entries.' : 'Subscribe to a feed to get started.'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = entries.map(entry => `
        <div class="entry">
          <div class="entry-title">
            <a href="${escapeHtml(entry.url)}" target="_blank">${escapeHtml(entry.title)}</a>
          </div>
          <div class="entry-meta">
            ${entry.author ? escapeHtml(entry.author) + ' · ' : ''}${formatDate(entry.pubDate)}
          </div>
          ${entry.description ? `<div class="entry-description">${escapeHtml(stripHtml(entry.description))}</div>` : ''}
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function stripHtml(str) {
      if (!str) return '';
      return str.replace(/<[^>]*>/g, '').trim();
    }

    function formatDate(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
      if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`;

      return date.toLocaleDateString();
    }

    // ==================== Event Handlers ====================

    document.getElementById('feedList').addEventListener('click', async (e) => {
      const feedItem = e.target.closest('.feed-item');
      if (!feedItem) return;

      // Handle delete button
      if (e.target.classList.contains('delete')) {
        const feedId = feedItem.dataset.feedId;
        if (feedId && confirm('Unsubscribe from this feed?')) {
          await unsubscribeFeed(feedId);
          if (currentFeedId === feedId) {
            currentFeedId = null;
          }
          await renderFeeds();
          await renderEntries();
        }
        return;
      }

      // Select feed
      document.querySelectorAll('.feed-item').forEach(el => el.classList.remove('active'));
      feedItem.classList.add('active');
      currentFeedId = feedItem.dataset.feedId || null;
      await renderEntries();
    });

    document.getElementById('subscribeInput').addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        const input = e.target;
        const url = input.value.trim();
        if (!url) return;

        input.disabled = true;
        const result = await subscribeFeed(url);
        input.disabled = false;

        if (result.success) {
          input.value = '';
          await renderFeeds();
          await renderEntries();
        } else {
          alert('Failed to subscribe: ' + result.error);
        }
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Refreshing...';

      await pollAllFeeds();
      await renderEntries();

      btn.disabled = false;
      btn.textContent = 'Refresh All';
    });

    // Handle entry link clicks
    document.getElementById('entries').addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href) {
        e.preventDefault();
        api.window.open(link.href);
      }
    });

    // ==================== Init ====================

    async function init() {
      await renderFeeds();
      await renderEntries();
    }

    init();
  </script>
</body>
</html>
