<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Example Extension</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  const api = window.app;
  const extId = extension.id;

  console.log(`[ext:${extId}] background.html loaded`);

  // ── V2 Tile Runtime ──
  // Initialize tile — validates capability token with main process
  console.log(`[ext:${extId}] initializing v2 tile`);
  await api.initialize();

  // Initialize extension (registers commands)
  if (extension.init) {
    console.log(`[ext:${extId}] calling init()`);
    await extension.init();
  }

  // Register shutdown handler
  api.onShutdown(() => {
    console.log(`[ext:${extId}] received shutdown`);
    if (extension.uninit) {
      extension.uninit();
    }
  });
</script>
</body>
</html>
