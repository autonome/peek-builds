<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Tag Actions</title>
    <link rel="stylesheet" type="text/css" href="home.css">

    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
    {
      "imports": {
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-input.js';
      import 'peek://app/components/peek-button.js';
      import 'peek://app/components/peek-select.js';
      import 'peek://app/components/peek-switch.js';
    </script>
  </head>
  <body>
    <div class="header-bar">
      <h1 class="page-title">Tag Pairs</h1>
      <button class="add-pair-btn" title="Add new tag pair">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <p class="page-description">Each pair defines two tags that toggle on item cards. Tag an item with either tag and a clickable icon appears.</p>

    <div class="pairs-list"></div>

    <script>
      // V2 tile runtime compat shims — bridge flat api.publish/subscribe
      // to api.pubsub.publish/subscribe so existing code works unchanged.
      (function() {
        const api = window.app;
        if (!api) return;
        const isTileV2 = typeof api.initialize === 'function';
        if (!isTileV2) return;
        if (api.pubsub && !api.publish) {
          api.publish = api.pubsub.publish;
          api.subscribe = api.pubsub.subscribe;
        }
        if (api.settings && !api.settings.getExtKey) {
          api.settings.getExtKey = (extId, key) => api.settings.get(extId + '.' + key);
        }
      })();
    </script>
    <script type="module" src="home.js"></script>
  </body>
</html>
