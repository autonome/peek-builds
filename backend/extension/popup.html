<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peek</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 320px;
      height: 48px;
      background-color: rgba(40, 44, 52, 0.95);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      color: white;
      overflow: hidden;
    }

    .center-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    .command-display {
      flex: 1;
      min-width: 0;
      height: 40px;
      position: relative;
    }

    #command-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      line-height: 40px;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: white;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      padding: 0;
      z-index: 2;
    }

    #command-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      line-height: 40px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      white-space: pre;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    #command-text .typed {
      color: white;
    }

    #command-text.placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* Feedback states */
    .feedback {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
    }

    .feedback.visible {
      display: flex;
    }

    .feedback.success {
      color: #4ade80;
    }

    .feedback.error {
      color: #f87171;
    }

    .feedback-icon {
      font-size: 20px;
      line-height: 1;
    }

    .feedback-text {
      font-size: 14px;
      font-weight: 500;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-display.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="center-wrapper">
    <div class="command-display" id="command-display">
      <input id="command-input" type="text" autofocus spellcheck="false" />
      <div id="command-text" class="placeholder">tag, note, or search...</div>
    </div>
    <div class="feedback" id="feedback">
      <span class="feedback-icon" id="feedback-icon"></span>
      <span class="feedback-text" id="feedback-text"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
