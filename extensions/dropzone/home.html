<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drop Zone</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title">Drop Zone</span>
    <button id="clear-btn" class="clear-btn" style="display: none;">Clear All</button>
  </div>
  <div id="dropzone" class="dropzone">
    <div class="dropzone-prompt">
      <div class="dropzone-icon">&#8615;</div>
      <div class="dropzone-text">Drop anything here</div>
      <div class="dropzone-hint">Files, URLs, text, images, HTML &mdash; inspect what arrives</div>
    </div>
  </div>
  <div id="results" class="results"></div>
  <script src="home.js"></script>
</body>
</html>
