<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Tag Actions</title>
    <link rel="stylesheet" type="text/css" href="home.css">

    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
    {
      "imports": {
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-input.js';
      import 'peek://app/components/peek-button.js';
      import 'peek://app/components/peek-select.js';
      import 'peek://app/components/peek-switch.js';
    </script>
  </head>
  <body>
    <!-- List View -->
    <div id="list-view">
      <div class="header-bar">
        <h1 class="page-title">Tag Actions</h1>
        <button class="add-action-btn" title="Add new tag action">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div class="search-container">
        <peek-input
          class="search-input"
          placeholder="Search actions..."
          type="search"
        ></peek-input>
      </div>
      <div class="actions-list"></div>
      <div class="presets-section" style="display: none;">
        <div class="presets-header">Suggested Actions</div>
        <div class="presets-list"></div>
      </div>
    </div>

    <!-- Detail/Edit View -->
    <div id="detail-view" style="display: none;">
      <div class="detail-header">
        <button class="back-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back
        </button>
      </div>
      <div class="detail-form"></div>
    </div>

    <script type="module" src="home.js"></script>
  </body>
</html>
