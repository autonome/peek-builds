<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
  <title>Entities</title>

  <!-- Import map for resolving bare module specifiers -->
  <script type="importmap">
  {
    "imports": {
      "lit": "peek://node_modules/lit/index.js",
      "lit/": "peek://node_modules/lit/",
      "lit-html": "peek://node_modules/lit-html/lit-html.js",
      "lit-html/": "peek://node_modules/lit-html/",
      "lit-element": "peek://node_modules/lit-element/lit-element.js",
      "lit-element/": "peek://node_modules/lit-element/",
      "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
    }
  }
  </script>

  <!-- Import peek-components -->
  <script type="module">
    import 'peek://app/components/peek-card.js';
    import 'peek://app/components/peek-grid.js';
    import 'peek://app/components/peek-input.js';
    import 'peek://app/components/peek-button.js';
    import 'peek://app/components/peek-button-group.js';
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--base00, #1a1a1a);
      color: var(--base05, #e0e0e0);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--base01, #252525);
      border-bottom: 1px solid var(--base02, #333);
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      flex: 1;
    }

    .header-count {
      font-size: 12px;
      color: var(--base04, #888);
      font-weight: normal;
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: var(--base01, #252525);
      border-bottom: 1px solid var(--base02, #333);
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      background: var(--base02, #333);
      border: 1px solid var(--base03, #444);
      color: var(--base05, #e0e0e0);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      background: var(--base03, #444);
    }

    .filter-btn.active {
      background: var(--blue, #4a9eff);
      border-color: var(--blue, #4a9eff);
      color: white;
    }

    .search-container {
      padding: 8px 16px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .entity-type-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      font-size: 13px;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .type-person { background: var(--blue, #4a9eff); color: white; }
    .type-organization { background: var(--green, #4aff9e); color: #1a1a1a; }
    .type-place { background: var(--yellow, #ffcc4a); color: #1a1a1a; }
    .type-event { background: var(--magenta, #ff4adb); color: white; }
    .type-email { background: var(--cyan, #4affee); color: #1a1a1a; }
    .type-phone { background: var(--orange, #ff8c4a); color: white; }
    .type-date { background: var(--violet, #9b4aff); color: white; }
    .type-product { background: var(--red, #ff4a4a); color: white; }
    .type-creative_work { background: var(--base04, #888); color: white; }
    .type-price { background: var(--green, #4aff9e); color: #1a1a1a; }
    .type-tracking_number { background: var(--orange, #ff8c4a); color: white; }

    .entity-name {
      font-weight: 500;
      font-size: 14px;
    }

    .entity-type {
      font-size: 11px;
      color: var(--base04, #888);
      text-transform: capitalize;
    }

    .entity-confidence {
      font-size: 11px;
      color: var(--base04, #888);
    }

    .entity-meta {
      font-size: 12px;
      color: var(--base04, #888);
      margin-top: 4px;
    }

    .entity-attrs {
      font-size: 12px;
      color: var(--base04, #aaa);
      margin-top: 4px;
    }

    .entity-attrs span {
      display: inline-block;
      margin-right: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--base04, #888);
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 16px;
    }

    peek-card {
      cursor: pointer;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-body {
      padding: 4px 0;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--base04, #888);
    }
  </style>
</head>
<body>
  <header>
    <h1>Entities <span class="header-count" id="entityCount"></span></h1>
    <peek-button id="extractBtn" variant="ghost" size="sm">Extract Current Page</peek-button>
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-type="">All</button>
    <button class="filter-btn" data-type="person">People</button>
    <button class="filter-btn" data-type="organization">Orgs</button>
    <button class="filter-btn" data-type="place">Places</button>
    <button class="filter-btn" data-type="event">Events</button>
    <button class="filter-btn" data-type="email">Emails</button>
    <button class="filter-btn" data-type="phone">Phones</button>
    <button class="filter-btn" data-type="date">Dates</button>
    <button class="filter-btn" data-type="product">Products</button>
  </div>

  <div class="search-container">
    <peek-input
      id="searchInput"
      placeholder="Search entities..."
      type="search"
    ></peek-input>
  </div>

  <div class="content">
    <peek-grid id="entityGrid" min-item-width="280" gap="12"></peek-grid>
  </div>

  <script type="module" src="home.js"></script>
</body>
</html>
