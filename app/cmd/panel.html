<!DOCTYPE html>
<html>
  <head>
    <title>peek:cmd:panel</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: rgba(40, 44, 52, 0.9);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
        color: white;
        overflow: hidden;
        /* -webkit-app-region: drag; -- Replaced by click-and-hold drag.js */
      }
      
      .center-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 10px;
        box-sizing: border-box;
      }
      
      /* Command display wrapper */
      .command-display {
        flex: 1;
        min-width: 0;
        height: 40px;
        position: relative;
      }
      
      /* Command input field */
      #command-input {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 40px;
        line-height: 40px;
        border: none;
        outline: none;
        background: transparent;
        color: transparent;
        caret-color: white;
        font-family: inherit;
        font-size: 20px;
        font-weight: 500;
        padding: 0;
        -webkit-app-region: no-drag;
        z-index: 2;
      }

      /* Suggestion element that shows the matching command with highlighting */
      #command-text {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 40px;
        line-height: 40px;
        font-family: inherit;
        font-size: 20px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        white-space: pre;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      #command-text .typed {
        color: white;
      }
      
      /* Styling for the matched part */
      #command-text .matched {
        text-decoration: underline;
      }
      
      /* Results list */
      #results {
        display: none;
        margin-top: 5px;
        width: 100%;
        max-height: 200px;
        overflow-y: auto;
        -webkit-app-region: no-drag;
      }
      
      #results:not(:empty) {
        display: block;
      }
      
      .command-item {
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
      }
      
      .command-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      
      .command-item.selected {
        background-color: rgba(255, 255, 255, 0.2);
      }

      /* Mode indicator - tag button style */
      .mode-indicator {
        display: flex;
        align-items: center;
        padding: 4px 10px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.15s ease;
        margin-right: 10px;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
        user-select: none;
      }

      .mode-indicator:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .mode-indicator:active {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(0.98);
      }

      .mode-indicator .mode-label {
        text-transform: capitalize;
      }

      /* Mode-specific colors */
      .mode-indicator[data-mode="page"] {
        background: rgba(102, 153, 204, 0.3);
        border-color: rgba(102, 153, 204, 0.5);
      }

      .mode-indicator[data-mode="group"] {
        background: rgba(153, 102, 204, 0.3);
        border-color: rgba(153, 102, 204, 0.5);
      }

      .mode-indicator[data-mode="settings"] {
        background: rgba(204, 153, 102, 0.3);
        border-color: rgba(204, 153, 102, 0.5);
      }

      .mode-indicator[data-mode="default"] {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="center-wrapper">
      <div id="mode-indicator" class="mode-indicator" title="Click to cycle modes">
        <span class="mode-label">default</span>
      </div>
      <div class="command-display">
        <input id="command-input" type="text" autofocus spellcheck="false" />
        <div id="command-text"></div>
      </div>
    </div>
    <div id="results"></div>
    
    <script type="module" src="../drag.js"></script>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
