<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>HUD</title>
</head>
<body>
<script type="module">
  import extension from './background.js';

  const api = window.app;
  const extId = extension.id;

  // Initialize HUD BEFORE signaling ready so its handlers are registered
  // before any other code publishes commands on ext:ready.
  if (extension.init) {
    await extension.init();
  }

  // Signal ready to main process — the hud-glue waitForExtLoaded tracker
  // watches did-frame-finish-load, but the ext:ready publish is also kept
  // to populate loadedConsolidatedExtensions for getRunningExtensions().
  api.publish('ext:ready', {
    id: extId,
    manifest: {
      id: extension.id,
      labels: extension.labels,
      version: '1.0.0'
    }
  }, api.scopes.SYSTEM);

  // Handle shutdown request from main process
  api.subscribe('app:shutdown', () => {
    if (extension.uninit) {
      extension.uninit();
    }
  }, api.scopes.SYSTEM);

  // Handle hud-specific shutdown
  api.subscribe(`ext:${extId}:shutdown`, () => {
    if (extension.uninit) {
      extension.uninit();
    }
  }, api.scopes.SYSTEM);
</script>
</body>
</html>
