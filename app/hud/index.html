<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>HUD (resident)</title>
</head>
<body>
<!--
  HUD resident renderer.

  This is the single-file core renderer for the HUD. It replaces the
  v1 pair of `background.html` + `background.js` (iframe inside the
  consolidated extension host) with a standalone, resident BrowserWindow
  loaded by `backend/electron/hud-glue.ts` with `tile-preload.cjs` and a
  trusted-builtin capability grant.

  The window has no visible UI — the HUD overlay itself is a separate
  window at `peek://hud/hud.html`, opened on-demand from this renderer
  via `api.window.open(...)`.
-->
<script type="module">
  import extension from './background.js';

  const api = window.app;
  const extId = extension.id;

  // Initialize the tile preload surface before any handler registration.
  // With the trustedBuiltin grant every IPC call is un-gated, but the
  // preload still needs its async token validation to complete before
  // `api.pubsub.*` / `api.commands.*` can dispatch.
  if (api.initialize) {
    await api.initialize();
  }

  // Initialize HUD BEFORE signaling ready so its handlers are registered
  // before any other code publishes commands on ext:ready.
  if (extension.init) {
    await extension.init();
  }

  // Signal ready to main process. The v2 surface routes api.pubsub.publish
  // through tile:pubsub:publish, which in turn feeds the same main-process
  // `publish()` that the v1 iframe path fed. Legacy subscribers
  // (loadedConsolidatedExtensions tracker, ext:ready downstream) continue
  // to see this event.
  api.pubsub.publish('ext:ready', {
    id: extId,
    manifest: {
      id: extension.id,
      labels: extension.labels,
      version: '1.0.0'
    }
  }, api.scopes.SYSTEM);

  // Handle shutdown request from main process.
  api.pubsub.subscribe('app:shutdown', () => {
    if (extension.uninit) {
      extension.uninit();
    }
  }, api.scopes.SYSTEM);

  // Handle hud-specific shutdown.
  api.pubsub.subscribe(`ext:${extId}:shutdown`, () => {
    if (extension.uninit) {
      extension.uninit();
    }
  }, api.scopes.SYSTEM);
</script>
</body>
</html>
