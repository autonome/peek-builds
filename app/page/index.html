<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Webview is positioned on the transparent canvas */
    webview {
      position: absolute;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      /* Use clip-path as fallback if border-radius doesn't clip webview content */
      -webkit-mask-image: -webkit-radial-gradient(white, white);
    }

    /* Navbar floats above the webview */
    .navbar {
      position: absolute;
      height: 36px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--theme-bg-secondary, rgba(30, 30, 30, 0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 15px;
      border: none;
      border-radius: 10px;
      -webkit-app-region: drag;
      user-select: none;
      -webkit-user-select: none;
      z-index: 100;
    }

    .navbar.visible {
      display: flex;
    }

    .nav-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }

    .nav-btn:active:not(:disabled) {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.2));
    }

    .nav-btn:disabled {
      color: var(--theme-text-muted, #555);
      cursor: default;
    }

    .url-text {
      -webkit-app-region: no-drag;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--theme-text-secondary, #aaa);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--theme-bg-tertiary, rgba(128, 128, 128, 0.1));
      cursor: text;
      min-width: 0;
    }

    .url-text:hover {
      background: var(--theme-bg, rgba(128, 128, 128, 0.18));
    }

    /* Trigger zone above webview */
    .trigger-zone {
      position: absolute;
      height: 50px;
      z-index: 50;
    }

    /* Resize handle */
    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      right: 0;
      bottom: 0;
      cursor: se-resize;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="trigger-zone" id="trigger-zone"></div>
  <div class="navbar" id="navbar">
    <button class="nav-btn" id="btn-back" title="Back (Cmd+[)">&#8592;</button>
    <button class="nav-btn" id="btn-forward" title="Forward (Cmd+])">&#8594;</button>
    <button class="nav-btn" id="btn-reload" title="Reload (Cmd+R)">&#8635;</button>
    <span class="url-text" id="url-text"></span>
  </div>
  <webview id="content" allowpopups></webview>
  <div class="resize-handle" id="resize-handle"></div>
  <script type="module" src="page.js"></script>
</body>
</html>
