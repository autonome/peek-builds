<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <!-- Import map for Lit (required by peek-navbar component) -->
  <script type="importmap">
  {
    "imports": {
      "lit": "peek://node_modules/lit/index.js",
      "lit/": "peek://node_modules/lit/",
      "lit-html": "peek://node_modules/lit-html/lit-html.js",
      "lit-html/": "peek://node_modules/lit-html/",
      "lit-element": "peek://node_modules/lit-element/lit-element.js",
      "lit-element/": "peek://node_modules/lit-element/",
      "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Three-column flexbox layout: gutters absorb extraWidth, center column holds all content */
    .page-layout {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .left-gutter, .right-gutter {
      flex: 1;
      min-width: 0;
    }

    .center-column {
      flex: none;
      position: relative;
      height: 100%;
    }

    /*
     * Webview — positioned by JS via updatePositions() relative to window origin.
     * The window is a tight-fitting BrowserWindow, not fullscreen.
     */
    webview {
      position: absolute;
      border: 1px solid rgba(128, 128, 128, 0.15);
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.15s ease, box-shadow 0.4s ease, background-color 0.3s ease;
    }

    /* Loading indicator: themed pulsing glow while page loads.
     * Uses --theme-accent for color, with --loading-glow-color as intermediary
     * so the color adapts to the active theme. */
    webview {
      --loading-glow-color: var(--theme-accent, #007aff);
    }

    @keyframes loading-glow {
      0%, 100% {
        box-shadow: 0 0 4px 1px color-mix(in srgb, var(--loading-glow-color) 15%, transparent),
                    0 0 10px 3px color-mix(in srgb, var(--loading-glow-color) 6%, transparent);
      }
      50% {
        box-shadow: 0 0 8px 2px color-mix(in srgb, var(--loading-glow-color) 40%, transparent),
                    0 0 16px 5px color-mix(in srgb, var(--loading-glow-color) 15%, transparent);
      }
    }

    /* Fade background in from transparent to avoid bright flash */
    @keyframes bg-fade-in {
      from { background-color: transparent; }
      to   { background-color: rgba(255, 255, 255, 0.95); }
    }

    @keyframes bg-fade-in-dark {
      from { background-color: transparent; }
      to   { background-color: rgba(30, 30, 30, 0.95); }
    }

    webview.loading {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.95);
      animation: bg-fade-in 0.3s ease forwards, loading-glow 1.2s ease-in-out 0.3s infinite;
      overflow: visible;
    }

    @media (prefers-color-scheme: dark) {
      webview.loading {
        background-color: rgba(30, 30, 30, 0.95);
        animation: bg-fade-in-dark 0.3s ease forwards, loading-glow 1.2s ease-in-out 0.3s infinite;
      }
    }

    /* Default visible state (after loading completes) */
    webview.loaded {
      opacity: 1;
    }

    /*
     * Navbar — positioned by JS at top of window when visible.
     * Window expands upward via setBounds() to accommodate it.
     * Dragging is handled by custom JS (moves window), not -webkit-app-region.
     */
    peek-navbar {
      position: absolute;
      z-index: 100;
      cursor: grab;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    peek-navbar.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Trigger zone — transparent strip above webview, always part of window.
     * Height is set by JS (TRIGGER_ZONE_HEIGHT). Hover reveals the navbar. */
    .trigger-zone {
      position: absolute;
      z-index: 50;
    }

    /* Resize handles — invisible 24x24 hit targets at corners */
    .resize-handle {
      position: absolute;
      width: 24px;
      height: 24px;
      z-index: 10;
      /* Prevent pointer capture from being interrupted */
      touch-action: none;
    }

    .resize-handle[data-dir="se"] { cursor: se-resize; }
    .resize-handle[data-dir="sw"] { cursor: sw-resize; }
    .resize-handle[data-dir="ne"] { cursor: ne-resize; }
    .resize-handle[data-dir="nw"] { cursor: nw-resize; }

    /* Drag overlay — covers webview during hold-to-drag */
    .drag-overlay {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .drag-overlay.active {
      pointer-events: all;
      cursor: grabbing;
    }

    /* --- Group mode widget --- */

    .group-mode-widget-body {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .group-mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .group-mode-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--theme-text-secondary, #aaa);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* --- Panel / Widget collapse toggle --- */

    .panel-toggle, .widget-toggle {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 9px;
      width: 14px;
      height: 14px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.15s;
      font-family: system-ui;
      line-height: 1;
    }

    .panel-toggle:hover, .widget-toggle:hover {
      color: var(--theme-text-secondary, #aaa);
    }

    .panel-toggle.collapsed, .widget-toggle.collapsed {
      transform: rotate(-90deg);
    }

    .panel-body-wrap, .widget-body-wrap {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.2s ease;
      overflow: hidden;
    }

    .panel-body-wrap.collapsed, .widget-body-wrap.collapsed {
      grid-template-rows: 0fr;
    }

    .panel-body-wrap > *, .widget-body-wrap > * {
      overflow: hidden;
      min-height: 0;
    }

    /* --- Widget system --- */

    .widget-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 140;
      pointer-events: none; /* Container itself is transparent to clicks */
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .widget-container.visible {
      opacity: 1;
    }

    .widget {
      pointer-events: auto;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .widget.visible {
      opacity: 1;
    }

    .widget.hiding {
      opacity: 0;
    }

    .widget-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .widget-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .widget-close {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 14px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }

    .widget-close:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }

    .widget-body {
      padding: 4px 10px 10px 10px;
    }

    /* OpenSearch discovery widget specific styles */

    .widget-engine-found {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .widget-engine-icon {
      font-size: 16px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    .widget-engine-name {
      font-size: 13px;
      color: var(--theme-text, #e0e0e0);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .widget-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 12px;
      font-family: inherit;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      width: 100%;
      justify-content: center;
    }

    .widget-action-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      color: var(--theme-text, #fff);
    }

    .widget-action-btn.confirmed {
      color: #6dca6d;
      cursor: default;
    }

    .widget-action-btn.confirmed:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      color: #6dca6d;
    }

    /* --- Page Info Panel (top-left) --- */

    .page-info-panel {
      position: absolute;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      max-width: 280px;
      min-width: 200px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .page-info-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .page-info-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .page-info-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }

    .page-info-panel .panel-body {
      padding: 4px 10px 10px 10px;
    }

    .page-info-panel .info-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-border) 30%, transparent);
    }

    .page-info-panel .info-row:last-child {
      border-bottom: none;
    }

    .page-info-panel .info-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--theme-text-muted, #777);
    }

    .page-info-panel .info-value {
      font-size: 12px;
      color: var(--theme-text, #e0e0e0);
      word-break: break-word;
      line-height: 1.4;
    }

    .page-info-panel .info-value.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-info-panel .og-image-preview {
      width: 100%;
      max-height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 4px;
    }

    .page-info-panel .info-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 8px 0;
    }

    /* --- Tags Panel (right side, top) --- */

    .tags-panel {
      position: absolute;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      max-width: 280px;
      min-width: 200px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .tags-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .tags-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .tags-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }

    .tags-panel .panel-body {
      padding: 4px 10px 10px 10px;
    }

    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .tags-list:empty {
      display: none;
      margin-bottom: 0;
    }

    .tags-list::-webkit-scrollbar {
      width: 4px;
    }

    .tags-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .tags-list::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 2px;
    }

    .tag-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      color: var(--theme-text, #e0e0e0);
      font-size: 11px;
      font-family: inherit;
      padding: 3px 6px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      max-width: 100%;
      overflow: hidden;
    }

    .tag-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      border-color: color-mix(in srgb, var(--theme-border) 60%, transparent);
    }

    .tag-btn .tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag-btn .tag-remove {
      font-size: 12px;
      line-height: 1;
      opacity: 0.5;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }

    .tag-btn:hover .tag-remove {
      opacity: 1;
      color: #f87171;
    }

    .tags-input-row {
      position: relative;
    }

    .tags-input-wrapper {
      position: relative;
    }

    .tags-input {
      width: 100%;
      background: color-mix(in srgb, var(--theme-bg-tertiary) 30%, transparent);
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      border-radius: 5px;
      color: var(--theme-text, #e0e0e0);
      font-size: 11px;
      font-family: inherit;
      padding: 4px 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    .tags-input:focus {
      border-color: var(--theme-accent, rgba(100, 150, 255, 0.5));
    }

    .tags-input::placeholder {
      color: var(--theme-text-muted, #666);
    }

    .tags-suggestion {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 4px 6px;
      font-size: 11px;
      font-family: inherit;
      color: var(--theme-text-muted, #555);
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
    }

    .tags-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 4px 0;
    }

    /* --- Entities Panel (right side) --- */

    .entities-panel {
      position: absolute;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      max-width: 280px;
      min-width: 200px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .entities-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .entities-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .entities-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }

    .panel-action-btn {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 10px;
      font-family: inherit;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }

    .panel-action-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      color: var(--theme-text, #fff);
    }

    .panel-action-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .entities-panel .panel-body {
      padding: 4px 10px 10px 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .entities-panel .panel-body::-webkit-scrollbar {
      width: 4px;
    }

    .entities-panel .panel-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .entities-panel .panel-body::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 2px;
    }

    .entities-panel .entity-group {
      margin-bottom: 8px;
    }

    .entities-panel .entity-group:last-child {
      margin-bottom: 0;
    }

    .entities-panel .entity-group-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--theme-text-muted, #777);
      margin-bottom: 4px;
    }

    .entities-panel .entity-item {
      padding: 3px 0;
      font-size: 12px;
      color: var(--theme-text, #e0e0e0);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entities-panel .entity-badge {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .entities-panel .entity-badge.person { background: #6dca6d; }
    .entities-panel .entity-badge.organization { background: #5b9bd5; }
    .entities-panel .entity-badge.place { background: #e6a23c; }
    .entities-panel .entity-badge.email { background: #c084fc; }
    .entities-panel .entity-badge.phone { background: #f472b6; }
    .entities-panel .entity-badge.event { background: #fb923c; }
    .entities-panel .entity-badge.product { background: #67e8f9; }
    .entities-panel .entity-badge.date { background: #fbbf24; }
    .entities-panel .entity-badge.tracking_number { background: #a78bfa; }
    .entities-panel .entity-badge.other { background: #94a3b8; }

    .entities-panel .entity-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 8px 0;
    }

    .entities-panel .entity-loading {
      color: var(--theme-text-muted, #666);
      font-size: 11px;
      padding: 8px 0;
    }

    /* --- Notes Panel (right side, below entities) --- */

    .notes-panel {
      position: absolute;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      border-radius: 10px;
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font, system-ui, sans-serif);
      font-size: 12px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .notes-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .notes-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .notes-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }

    .notes-count {
      font-size: 10px;
      color: var(--theme-text-muted, #777);
      background: color-mix(in srgb, var(--theme-border) 30%, transparent);
      border-radius: 8px;
      padding: 1px 6px;
      min-width: 16px;
      text-align: center;
    }

    .notes-add-btn {
      background: none;
      border: 1px solid color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 4px;
      color: var(--theme-text-secondary, #aaa);
      font-size: 14px;
      line-height: 1;
      width: 22px;
      height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .notes-add-btn:hover {
      background: color-mix(in srgb, var(--theme-border) 30%, transparent);
      color: var(--theme-text, #e0e0e0);
    }

    .notes-body {
      padding: 4px 10px 10px 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .notes-body::-webkit-scrollbar {
      width: 4px;
    }

    .notes-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .notes-body::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 2px;
    }

    .notes-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 8px 0;
    }

    .notes-item {
      display: flex;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-border) 20%, transparent);
      cursor: pointer;
    }

    .notes-item:last-child {
      border-bottom: none;
    }

    .notes-item:hover {
      background: color-mix(in srgb, var(--theme-border) 10%, transparent);
      border-radius: 4px;
    }

    .notes-item-editing {
      background: color-mix(in srgb, var(--theme-border) 15%, transparent);
      border-radius: 4px;
    }

    .notes-text-wrap {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .notes-anchor-text {
      font-size: 11px;
      color: var(--theme-text-muted, #888);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .notes-content-preview {
      font-size: 12px;
      color: var(--theme-text, #e0e0e0);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .notes-textarea {
      width: 100%;
      background: color-mix(in srgb, var(--base00) 60%, transparent);
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      border-radius: 4px;
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font, system-ui, sans-serif);
      font-size: 12px;
      padding: 6px 8px;
      resize: vertical;
      margin-top: 4px;
      outline: none;
    }

    .notes-textarea:focus {
      border-color: var(--theme-accent, #007aff);
    }

    .notes-textarea::placeholder {
      color: var(--theme-text-muted, #666);
    }

    .notes-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .notes-btn-delete {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      opacity: 0.5;
      transition: opacity 0.15s;
    }

    .notes-btn-delete:hover {
      opacity: 1;
      color: var(--base08, #f44);
    }

    .notes-btn-confirm {
      opacity: 1;
      color: var(--base09, #f80) !important;
      font-weight: bold;
    }

    /* --- Extensions Panel (left side, below page info) --- */

    .extensions-panel {
      position: absolute;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      max-width: 280px;
      min-width: 200px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .extensions-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .extensions-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .extensions-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }

    .extensions-panel .panel-body {
      padding: 4px 10px 10px 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .extensions-panel .panel-body::-webkit-scrollbar {
      width: 4px;
    }

    .extensions-panel .panel-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .extensions-panel .panel-body::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 2px;
    }

    .ext-loading {
      color: var(--theme-text-muted, #666);
      font-size: 11px;
      padding: 8px 0;
    }

    .ext-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 8px 0;
    }

    .ext-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-border) 30%, transparent);
    }

    .ext-item:last-child {
      border-bottom: none;
    }

    .ext-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0.8;
    }

    .ext-info {
      flex: 1;
      min-width: 0;
    }

    .ext-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--theme-text, #e0e0e0);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ext-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .ext-action-btn {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 11px;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }

    .ext-action-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      color: var(--theme-text, #fff);
    }

    /* Adblocker toggle */

    .ext-toggle {
      position: relative;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }

    .ext-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .ext-toggle-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: color-mix(in srgb, var(--theme-border) 60%, transparent);
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ext-toggle-track::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .ext-toggle input:checked + .ext-toggle-track {
      background: #4ade80;
    }

    .ext-toggle input:checked + .ext-toggle-track::before {
      transform: translateX(14px);
    }

    .ext-adblocker-status {
      font-size: 10px;
      color: var(--theme-text-muted, #777);
    }

    /* --- Link status bar (bottom-left, shown on hover over links) --- */

    .link-status-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 200;
      max-width: 60%;
      padding: 4px 8px;
      background: color-mix(in srgb, var(--base00, #1e1e1e) 90%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid color-mix(in srgb, var(--theme-border, rgba(255,255,255,0.1)) 40%, transparent);
      border-radius: 6px;
      color: var(--theme-text-secondary, #aaa);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 11px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .link-status-bar.visible {
      opacity: 1;
    }
  </style>
</head>
<body data-no-drag>
  <div class="page-layout">
    <div class="left-gutter"></div>
    <div class="center-column" id="center-column">
      <div class="trigger-zone" id="trigger-zone"></div>
      <script type="module">
        import 'peek://app/components/peek-navbar.js';
      </script>
      <peek-navbar id="navbar"></peek-navbar>
      <webview id="content" allowpopups></webview>
      <div class="drag-overlay" id="drag-overlay"></div>
      <div class="resize-handle" id="resize-se" data-dir="se"></div>
      <div class="resize-handle" id="resize-sw" data-dir="sw"></div>
      <div class="resize-handle" id="resize-ne" data-dir="ne"></div>
      <div class="resize-handle" id="resize-nw" data-dir="nw"></div>
      <div class="resize-handle" id="resize-nav-ne" data-dir="ne"></div>
      <div class="resize-handle" id="resize-nav-nw" data-dir="nw"></div>
      <!-- Page Info Panel (top-left, shown with navbar) -->
      <div class="page-info-panel" id="page-info-panel">
        <div class="panel-header">
          <button class="panel-toggle" title="Collapse">&#x25BC;</button>
          <span class="panel-title">Page Info</span>
        </div>
        <div class="panel-body-wrap">
          <div class="panel-body" id="page-info-body">
            <div class="info-empty">Loading page info...</div>
          </div>
        </div>
      </div>

      <!-- Tags Panel (right side, top of right stack, shown with navbar) -->
      <div class="tags-panel" id="tags-panel">
        <div class="panel-header">
          <button class="panel-toggle" title="Collapse">&#x25BC;</button>
          <span class="panel-title">Tags</span>
        </div>
        <div class="panel-body-wrap">
          <div class="panel-body" id="tags-body">
            <div class="tags-list" id="tags-list"></div>
            <div class="tags-input-row">
              <div class="tags-input-wrapper">
                <input type="text" class="tags-input" id="tags-input" placeholder="Add tag..." autocomplete="off" spellcheck="false">
                <span class="tags-suggestion" id="tags-suggestion"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Notes Panel (right side, below tags, shown with navbar) -->
      <!-- DOM is managed by PageNotesPane class in page-notes.js -->
      <div id="notes-panel-anchor"></div>

      <!-- Entities Panel (right side, below notes, shown with navbar) -->
      <div class="entities-panel" id="entities-panel">
        <div class="panel-header">
          <button class="panel-toggle" title="Collapse">&#x25BC;</button>
          <span class="panel-title">Entities</span>
          <button class="panel-action-btn" id="entities-rescan-btn" title="Re-extract entities">Rescan</button>
        </div>
        <div class="panel-body-wrap">
          <div class="panel-body" id="entities-body">
            <div class="entity-empty">No entities detected yet</div>
          </div>
        </div>
      </div>

      <!-- Extensions Panel (left side, below page info, shown with navbar) -->
      <div class="extensions-panel" id="extensions-panel">
        <div class="panel-header">
          <button class="panel-toggle" title="Collapse">&#x25BC;</button>
          <span class="panel-title">Extensions</span>
        </div>
        <div class="panel-body-wrap">
          <div class="panel-body" id="extensions-body">
            <div class="ext-loading">Loading extensions...</div>
          </div>
        </div>
      </div>

      <div class="widget-container" id="widget-container"></div>
      <!-- Link status bar (shows URL on hover, like browser status bar) -->
      <div class="link-status-bar" id="link-status-bar"></div>
    </div>
    <div class="right-gutter"></div>
  </div>
  <script type="module" src="page.js"></script>
</body>
</html>
