<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Webview fills the entire window */
    webview {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      -webkit-mask-image: -webkit-radial-gradient(white, white);
    }

    /*
     * FLOATING NAVBAR — DO NOT ADD AN INLINE/EMBEDDED NAVBAR
     *
     * The navbar is a FLOATING overlay shown via Cmd+L or hover trigger.
     * It is NOT an embedded bar at the top of the page.
     * It does NOT use -webkit-app-region: drag.
     *
     * Any inline/embedded navbar was deliberately removed.
     * Do not re-add it under any circumstances without explicit user approval.
     */
    .navbar {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 600px);
      height: 40px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--theme-bg-secondary, rgba(30, 30, 30, 0.95));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
      user-select: none;
      -webkit-user-select: none;
      z-index: 100;
    }

    .navbar.visible {
      display: flex;
    }

    .nav-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }

    .nav-btn:active:not(:disabled) {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.2));
    }

    .nav-btn:disabled {
      color: var(--theme-text-muted, #555);
      cursor: default;
    }

    .url-text {
      -webkit-app-region: no-drag;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--theme-text-secondary, #aaa);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--theme-bg-tertiary, rgba(128, 128, 128, 0.1));
      cursor: text;
      min-width: 0;
    }

    .url-text:hover {
      background: var(--theme-bg, rgba(128, 128, 128, 0.18));
    }

    /* Trigger zone hidden — navbar is shown on demand via Cmd+L only */
    .trigger-zone {
      display: none;
    }

    /* Resize handle */
    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      right: 0;
      bottom: 0;
      cursor: se-resize;
      z-index: 10;
    }

    /* Mode indicator - subtle corner badge */
    .mode-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--theme-font-sans, system-ui, -apple-system, sans-serif);
      z-index: 200;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .mode-indicator.visible {
      display: flex;
    }

    .mode-indicator .mode-label {
      text-transform: capitalize;
    }

    .mode-indicator .group-name {
      display: none;
      opacity: 0.9;
    }

    /* Mode-specific styles */
    .mode-indicator[data-mode="page"] {
      display: none; /* Hide in page mode - it's the default */
    }

    .mode-indicator[data-mode="group"] {
      display: flex;
      background: rgba(153, 102, 204, 0.85);
      color: white;
      border: 1px solid rgba(153, 102, 204, 0.9);
    }

    .mode-indicator[data-mode="group"] .group-name {
      display: inline;
    }
  </style>
</head>
<body data-no-drag>
  <!-- Mode indicator - shown when in group mode -->
  <div id="mode-indicator" class="mode-indicator">
    <span class="mode-label">page</span>
    <span class="group-name"></span>
  </div>
  <div class="trigger-zone" id="trigger-zone"></div>
  <div class="navbar" id="navbar">
    <button class="nav-btn" id="btn-back" title="Back (Cmd+[)">&#8592;</button>
    <button class="nav-btn" id="btn-forward" title="Forward (Cmd+])">&#8594;</button>
    <button class="nav-btn" id="btn-reload" title="Reload (Cmd+R)">&#8635;</button>
    <span class="url-text" id="url-text"></span>
  </div>
  <webview id="content" allowpopups></webview>
  <div class="resize-handle" id="resize-handle"></div>
  <script type="module" src="page.js"></script>
</body>
</html>
