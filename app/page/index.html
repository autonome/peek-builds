<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <!-- Import map for Lit (required by peek-navbar component) -->
  <script type="importmap">
  {
    "imports": {
      "lit": "peek://node_modules/lit/index.js",
      "lit/": "peek://node_modules/lit/",
      "lit-html": "peek://node_modules/lit-html/lit-html.js",
      "lit-html/": "peek://node_modules/lit-html/",
      "lit-element": "peek://node_modules/lit-element/lit-element.js",
      "lit-element/": "peek://node_modules/lit-element/",
      "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /*
     * Webview — positioned by JS via updatePositions() relative to window origin.
     * The window is a tight-fitting BrowserWindow, not fullscreen.
     */
    webview {
      position: absolute;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      -webkit-mask-image: -webkit-radial-gradient(white, white);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    webview.ready {
      opacity: 1;
    }

    /*
     * Navbar — positioned by JS at top of window when visible.
     * Window expands upward via setBounds() to accommodate it.
     * Dragging is handled by custom JS (moves window), not -webkit-app-region.
     */
    peek-navbar {
      position: absolute;
      display: none;
      z-index: 100;
      cursor: grab;
    }

    peek-navbar.visible {
      display: block;
    }

    /* Trigger zone — transparent strip above webview, always part of window.
     * Height is set by JS (TRIGGER_ZONE_HEIGHT). Hover reveals the navbar. */
    .trigger-zone {
      position: absolute;
      z-index: 50;
    }

    /* Resize handles — invisible 24x24 hit targets at corners */
    .resize-handle {
      position: absolute;
      width: 24px;
      height: 24px;
      z-index: 10;
      /* Prevent pointer capture from being interrupted */
      touch-action: none;
    }

    .resize-handle[data-dir="se"] { cursor: se-resize; }
    .resize-handle[data-dir="sw"] { cursor: sw-resize; }
    .resize-handle[data-dir="ne"] { cursor: ne-resize; }
    .resize-handle[data-dir="nw"] { cursor: nw-resize; }

    /* Drag overlay — covers webview during hold-to-drag */
    .drag-overlay {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .drag-overlay.active {
      pointer-events: all;
      cursor: grabbing;
    }

    /* Mode indicator - subtle corner badge */
    .mode-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--theme-font-sans, system-ui, -apple-system, sans-serif);
      z-index: 200;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .mode-indicator.visible {
      display: flex;
    }

    .mode-indicator .mode-label {
      text-transform: capitalize;
    }

    .mode-indicator .group-name {
      display: none;
      opacity: 0.9;
    }

    /* Mode-specific styles */
    .mode-indicator[data-mode="page"] {
      display: none; /* Hide in page mode - it's the default */
    }

    .mode-indicator[data-mode="group"] {
      display: flex;
      background: rgba(153, 102, 204, 0.85);
      color: white;
      border: 1px solid rgba(153, 102, 204, 0.9);
    }

    .mode-indicator[data-mode="group"] .group-name {
      display: inline;
    }

    /* --- Widget system --- */

    .widget-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 150;
      pointer-events: none; /* Container itself is transparent to clicks */
    }

    .widget {
      pointer-events: auto;
      background: var(--theme-bg-secondary, rgba(30, 30, 30, 0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 13px;
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      transform: translateX(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 280px;
      min-width: 200px;
    }

    .widget.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .widget.hiding {
      opacity: 0;
      transform: translateX(8px);
    }

    .widget-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .widget-title {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--theme-text-secondary, #aaa);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .widget-close {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 14px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }

    .widget-close:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }

    .widget-body {
      padding: 0 10px 10px 10px;
    }

    /* OpenSearch discovery widget specific styles */

    .widget-engine-found {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .widget-engine-icon {
      font-size: 16px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    .widget-engine-name {
      font-size: 13px;
      color: var(--theme-text, #e0e0e0);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .widget-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 12px;
      font-family: inherit;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      width: 100%;
      justify-content: center;
    }

    .widget-action-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      color: var(--theme-text, #fff);
    }

    .widget-action-btn.confirmed {
      color: #6dca6d;
      cursor: default;
    }

    .widget-action-btn.confirmed:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      color: #6dca6d;
    }
  </style>
</head>
<body data-no-drag>
  <!-- Mode indicator - shown when in group mode -->
  <div id="mode-indicator" class="mode-indicator">
    <span class="mode-label">page</span>
    <span class="group-name"></span>
  </div>
  <div class="trigger-zone" id="trigger-zone"></div>
  <script type="module">
    import 'peek://app/components/peek-navbar.js';
  </script>
  <peek-navbar id="navbar"></peek-navbar>
  <webview id="content" allowpopups></webview>
  <div class="drag-overlay" id="drag-overlay"></div>
  <div class="resize-handle" id="resize-se" data-dir="se"></div>
  <div class="resize-handle" id="resize-sw" data-dir="sw"></div>
  <div class="resize-handle" id="resize-ne" data-dir="ne"></div>
  <div class="resize-handle" id="resize-nw" data-dir="nw"></div>
  <div class="resize-handle" id="resize-nav-ne" data-dir="ne"></div>
  <div class="resize-handle" id="resize-nav-nw" data-dir="nw"></div>
  <div class="widget-container" id="widget-container"></div>
  <script type="module" src="page.js"></script>
</body>
</html>
