# Linux AppImage build. Slow (full Electron download + package), so it runs
# on version tags and on demand rather than on every push — see gate.yml for
# the per-push checks. Use the manual trigger to exercise it without cutting
# a tag; to iterate on a feature branch, add that branch to the push trigger
# temporarily and drop it again before merging.
#
# Engine choice: nixery rather than microvm. Packaging never executes the
# Electron binary — electron-builder only bundles it — so the build needs no
# steam-run and no NixOS guest. A microvm run of this workflow failed before
# any step executed, at "guest agent connection lost: nix config build
# failed", with no step logs. If it ever moves back to microvm, Electron's
# prebuilt binary cannot run unpatched on NixOS and steam-run becomes a
# required dependency.
#
# The dependency list is deliberately short. gcc, pkg-config, openssl, and
# python are not needed: better-sqlite3 was the only package requiring a
# node-gyp toolchain and it left the workspace when apps/desktop/main
# moved to node:sqlite.
#
# electron-builder's linux target list is [dir, AppImage] only; .deb and .rpm
# are intentionally excluded (its bundled fpm has no arm64 build — see the
# comment in apps/desktop/electron-builder.yml). If the spindle runner turns
# out to be x86, re-enabling deb/rpm there is a separate decision, not
# something this workflow should do silently.

when:
  - event: ["push"]
    tag: ["v*"]
  - event: ["manual"]

engine: "nixery"

# squashfstools and desktop-file-utils replace two binaries electron-builder
# would otherwise run from its downloaded AppImage bundle. Those are linked
# against a loader at /lib64, which this image does not have, so exec fails
# with ENOENT even though the file is present. curl and gnutar fetch the
# bundle so its data files (runtimes/, lib/) can be reused as shipped.
dependencies:
  nixpkgs:
    [
      nodejs_24,
      yarn-berry,
      git,
      squashfstools,
      desktop-file-utils,
      curl,
      gnutar,
      gzip,
    ]

steps:
  - name: install
    command: yarn install --immutable

  - name: build
    # Compiles the app (schema codegen + tsc + patch scripts) before
    # packaging — electron-builder packages compiled output, not source.
    command: yarn build

  - name: package AppImage
    # Produces out/Peek-*.AppImage. Runs from the repo root, which is where
    # electron-builder finds its config: the root package.json "build" key
    # extends apps/desktop/electron-builder.yml. Invoking electron-builder
    # from inside apps/desktop instead makes it read the wrong package.json.
    #
    # The AppImage toolset is assembled here rather than left to
    # electron-builder: its mksquashfs and desktop-file-validate cannot run in
    # this image (see the dependency note above), so both are swapped for the
    # nix builds. Everything else in the bundle — runtimes/ and lib/ — is data
    # concatenated into the AppImage rather than executed, so it is used as
    # shipped. APPIMAGE_TOOLS_PATH is exported here rather than in a workflow
    # `environment:` block (which does exist) because the path is derived from
    # $PWD; naming it up front would hard-code the runner's workspace path.
    command: |
      set -e
      TOOLS="$PWD/.appimage-tools"
      rm -rf "$TOOLS" && mkdir -p "$TOOLS"
      curl -fsSL -o /tmp/appimage-tools.tar.gz \
        https://github.com/electron-userland/electron-builder-binaries/releases/download/appimage%401.0.3/appimage-tools-runtime-20251108.tar.gz
      tar -xzf /tmp/appimage-tools.tar.gz -C "$TOOLS"
      # Both names are symlinks to a shared appimage-tool binary, and cp
      # follows a symlink to write its target — so copying onto them in place
      # makes the second copy overwrite the first, leaving one tool running the
      # other. Remove the links before writing real files in their place.
      rm -f "$TOOLS/mksquashfs" "$TOOLS/desktop-file-validate"
      cp "$(command -v mksquashfs)" "$TOOLS/mksquashfs"
      cp "$(command -v desktop-file-validate)" "$TOOLS/desktop-file-validate"
      export APPIMAGE_TOOLS_PATH="$TOOLS"
      yarn workspace @peek/desktop run build:electron:dist
