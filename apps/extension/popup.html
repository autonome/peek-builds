<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peek</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 320px;
      height: 72px;
      background-color: rgba(40, 44, 52, 0.95);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      color: white;
      overflow: hidden;
    }

    .center-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .command-row {
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 40px;
    }

    .command-display {
      flex: 1;
      min-width: 0;
      height: 40px;
      position: relative;
    }

    #command-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      line-height: 40px;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: white;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      padding: 0;
      z-index: 2;
    }

    #command-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      line-height: 40px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      white-space: pre;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    #command-text .typed {
      color: white;
    }

    #command-text.placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* Feedback states */
    .feedback {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
    }

    .feedback.visible {
      display: flex;
    }

    .feedback.success {
      color: #4ade80;
    }

    .feedback.error {
      color: #f87171;
    }

    .feedback-icon {
      font-size: 20px;
      line-height: 1;
    }

    .feedback-text {
      font-size: 14px;
      font-weight: 500;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-display.hidden {
      display: none;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-status.warning {
      color: #fbbf24;
    }

    .sync-status.syncing {
      color: #60a5fa;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .sync-status.syncing .sync-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .sync-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 3px;
      transition: background 0.15s, color 0.15s;
    }

    .sync-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
    }

    .sync-btn:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .pending-badge {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      padding: 1px 5px;
      border-radius: 8px;
      font-size: 10px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="center-wrapper">
    <div class="command-row">
      <div class="command-display" id="command-display">
        <input id="command-input" type="text" autofocus spellcheck="false" />
        <div id="command-text" class="placeholder">tag, note, server, key, sync...</div>
      </div>
      <div class="feedback" id="feedback">
        <span class="feedback-icon" id="feedback-icon"></span>
        <span class="feedback-text" id="feedback-text"></span>
      </div>
    </div>
    <div class="status-bar">
      <div class="sync-status" id="sync-status">
        <span class="sync-dot"></span>
        <span id="sync-text">Loading...</span>
        <span class="pending-badge" id="pending-badge" style="display: none;"></span>
      </div>
      <button class="sync-btn" id="sync-btn" title="Sync now">Sync</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
