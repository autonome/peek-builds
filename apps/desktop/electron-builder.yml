appId: com.autonome.peek
productName: Peek
copyright: Copyright © 2024 Dietrich Ayala

# Directories
directories:
  output: out
  buildResources: apps/desktop/assets

# Include only production dependencies
npmRebuild: true
nodeGypRebuild: false

# Files to include/exclude
files:
  - "**/*"
  - "apps/desktop/assets/**/*"
  # Exclude build output (critical - prevents recursive bloat)
  - "!out"
  - "!out/**"
  # Exclude version control and tooling
  - "!.jj"
  - "!.jj/**"
  - "!.yarn"
  - "!.yarn/**"
  - "!.claude"
  - "!.claude/**"
  - "!.agent-task.md"
  # Exclude agent workspaces (CRITICAL - these are full project copies)
  - "!tmp"
  - "!tmp/**"
  # Exclude backend directories not needed for Electron
  - "!backend"
  - "!backend/**"
  # Exclude non-desktop app directories
  - "!apps/mobile"
  - "!apps/mobile/**"
  - "!apps/server"
  - "!apps/server/**"
  - "!apps/extension"
  - "!apps/extension/**"
  - "!apps/tauri-desktop"
  - "!apps/tauri-desktop/**"
  # Exclude development/test directories
  - "!apps/desktop/tests"
  - "!apps/desktop/tests/**"
  - "!notes"
  - "!notes/**"
  - "!docs"
  - "!docs/**"
  - "!old-extension"
  - "!old-extension/**"
  # Exclude dev scripts and config — but whitelist peek-cli.mjs back in
  # so it ships for users binding it to system keyboard shortcuts.
  # See apps/desktop/main/cli-helper.ts and docs/global-hotkeys-on-wayland.md.
  - "!scripts"
  - "!scripts/**"
  - "scripts/peek-cli.mjs"
  - "!apps/desktop/playwright.config.ts"
  # Exclude dev artifacts and docs
  - "!settings-screenshot.png"
  - "!*.md"
  # Standard node_modules exclusions
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!**/node_modules/*/{.github,docs}"
  - "!forge.config.js"

# ASAR packaging
asar: true
asarUnpack:
  - "apps/desktop/assets/tray/**/*"
  # Chrome extensions must live on a real filesystem — Electron's
  # session.loadExtension() can't read from inside app.asar.
  - "apps/desktop/chrome-extensions/**/*"
  # peek-cli is invoked by an external `node` process via DE keyboard
  # shortcuts; node can't read from inside app.asar, so unpack it.
  - "scripts/peek-cli.mjs"

# macOS specific
mac:
  category: public.app-category.productivity
  icon: apps/desktop/assets/appicon.icns
  identity: null  # Disable code signing
  target:
    - target: dir
      arch: arm64
  # Protocol handlers for http/https
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: HTTP
        CFBundleURLSchemes:
          - http
      - CFBundleURLName: HTTPS
        CFBundleURLSchemes:
          - https
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML Document
        CFBundleTypeRole: Viewer
        LSItemContentTypes:
          - public.html
        LSHandlerRank: Alternate

# Windows specific
win:
  icon: apps/desktop/assets/appicon.ico
  target:
    - target: dir

# Linux specific
linux:
  icon: apps/desktop/assets/appicon.png
  category: Network
  # Register Peek as a candidate handler for http/https URLs and HTML
  # documents so the system "Default Applications" UI offers Peek and
  # `xdg-mime default peek.desktop x-scheme-handler/http` works (which
  # is what `app.setAsDefaultProtocolClient('http')` ultimately invokes
  # on Linux). For AppImage builds, the .desktop file inside the bundle
  # isn't installed system-wide; apps/desktop/main/desktop-installer.ts
  # shadow-installs to ~/.local/share/applications/ on every launch and
  # keeps the same MimeType list. For deb/rpm (when re-enabled), the
  # package installs the .desktop directly to /usr/share/applications/
  # with these mime types pre-registered.
  mimeTypes:
    - x-scheme-handler/http
    - x-scheme-handler/https
    - x-scheme-handler/about
    - x-scheme-handler/unknown
    - text/html
    - application/xhtml+xml
  desktop:
    entry:
      Categories: Network;WebBrowser;
      StartupWMClass: Peek
  target:
    # `dir` stays for fast iteration / smoke tests.
    - target: dir
    # AppImage works on arm64 (Asahi) and x86 alike. The mount path is
    # ephemeral, so the daemon shadow-copies peek-cli.mjs to
    # ~/.local/share/peek/peek-cli.mjs at startup (see cli-helper.ts).
    - target: AppImage
    # NOTE: `.deb` and `.rpm` are intentionally not listed here.
    # electron-builder bundles an x86-only fpm binary and there's no
    # arm64 build in electron-builder-binaries, so packaging fails on
    # Asahi without FEX. Add `- target: deb` / `- target: rpm` back
    # when building on an x86 host (or after installing FEX locally).
