<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Peek Diagnostic</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
    h2 { color: #4fc3f7; margin-top: 30px; }
    pre { background: #2d2d2d; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 400px; overflow-y: auto; }
    .key { color: #81c784; }
    .value { color: #fff59d; }
    button { background: #4fc3f7; color: #000; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; }
    button:hover { background: #29b6f6; }
    .section { margin-bottom: 30px; }
  </style>
</head>
<body>
  <h1>Peek Diagnostic Tool</h1>
  <p>This page helps inspect localStorage and datastore contents.</p>

  <div class="section">
    <button onclick="dumpLocalStorage()">Dump localStorage</button>
    <button onclick="dumpDatastore()">Dump feature_settings from datastore</button>
    <button onclick="dumpBoth()">Dump Both</button>
    <button onclick="copyResults()">Copy Results</button>
  </div>

  <div class="section" style="margin-top: 20px; padding: 15px; background: #2d2d2d; border-radius: 5px;">
    <h3 style="margin-top: 0; color: #4fc3f7;">Backup Tools</h3>
    <p style="color: #aaa; font-size: 12px;">Create and manage database backups:</p>
    <button onclick="createBackup()">Backup Now</button>
    <button onclick="listBackups()">List Backups</button>
    <button onclick="openBackupFolder()">Open Backup Folder</button>
    <div id="backup-output" style="margin-top: 15px;"></div>
  </div>

  <div id="output"></div>

  <script type="module">
    const api = window.app;
    const output = document.getElementById('output');

    // No IZUI init needed — backend handles parent tracking and focus restoration via roles.

    function log(title, content) {
      const section = document.createElement('div');
      section.innerHTML = `<h2>${title}</h2><pre>${content}</pre>`;
      output.appendChild(section);
    }

    function clearOutput() {
      output.innerHTML = '';
    }

    window.dumpLocalStorage = function() {
      clearOutput();
      const items = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        items.push({ key, value });
      }

      // Sort by key
      items.sort((a, b) => a.key.localeCompare(b.key));

      // Group by prefix (UUID or name before +)
      const grouped = {};
      items.forEach(item => {
        const parts = item.key.split('+');
        const prefix = parts[0] || 'other';
        if (!grouped[prefix]) grouped[prefix] = [];
        grouped[prefix].push(item);
      });

      let html = `Total items: ${items.length}\n\n`;

      for (const [prefix, groupItems] of Object.entries(grouped)) {
        html += `=== ${prefix} ===\n`;
        groupItems.forEach(item => {
          let displayValue = item.value;
          try {
            const parsed = JSON.parse(item.value);
            if (Array.isArray(parsed)) {
              displayValue = `Array[${parsed.length}]: ${JSON.stringify(parsed, null, 2)}`;
            } else if (typeof parsed === 'object') {
              displayValue = JSON.stringify(parsed, null, 2);
            }
          } catch {}
          html += `  <span class="key">${item.key}</span>:\n    <span class="value">${displayValue}</span>\n\n`;
        });
      }

      log('localStorage Contents', html);
    };

    window.dumpDatastore = async function() {
      clearOutput();
      try {
        const result = await api.datastore.getTable('feature_settings');
        if (result.success) {
          const data = result.data || {};
          const entries = Object.entries(data);
          let html = `Total rows: ${entries.length}\n\n`;

          entries.forEach(([rowId, row]) => {
            let displayValue = row.value;
            try {
              const parsed = JSON.parse(row.value);
              if (Array.isArray(parsed)) {
                displayValue = `Array[${parsed.length}]: ${JSON.stringify(parsed, null, 2)}`;
              } else if (typeof parsed === 'object') {
                displayValue = JSON.stringify(parsed, null, 2);
              }
            } catch {}
            html += `<span class="key">${rowId}</span> (${row.featureId}:${row.key}):\n  <span class="value">${displayValue}</span>\n\n`;
          });

          log('feature_settings Table', html);
        } else {
          log('feature_settings Table', `Error: ${result.error}`);
        }
      } catch (err) {
        log('feature_settings Table', `Error: ${err.message}`);
      }
    };

    window.dumpBoth = async function() {
      clearOutput();
      window.dumpLocalStorage();
      await window.dumpDatastore();
    };

    window.copyResults = function() {
      const text = output.innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      });
    };

    // ==================== Backup Functions ====================

    const backupOutput = document.getElementById('backup-output');

    function logBackup(title, content, isError = false) {
      backupOutput.innerHTML = `<h4 style="color: ${isError ? '#f44336' : '#4fc3f7'}; margin: 0 0 10px 0;">${title}</h4><pre style="margin: 0; max-height: 300px; overflow-y: auto;">${content}</pre>`;
    }

    const BACKUP_NOT_CONFIGURED_MSG = `Backup directory not configured.\n\nTo enable backups:\n1. Go to Settings > Core\n2. Set "backupDir" to your desired backup location\n   (e.g., ~/sync/peek-backups)\n3. Backups will run automatically on app startup (daily)`;

    window.createBackup = async function() {
      logBackup('Creating Backup', 'Please wait...');
      try {
        const result = await api.backup.create();
        if (result.success) {
          logBackup('Backup Created', `Successfully created backup:\n${result.path}`);
        } else {
          logBackup('Backup Failed', result.error || 'Unknown error', true);
        }
      } catch (err) {
        logBackup('Backup Error', err.message, true);
      }
    };

    window.listBackups = async function() {
      logBackup('Loading', 'Fetching backup list...');
      try {
        const result = await api.backup.list();
        if (result.success) {
          const { backups, backupDir } = result.data;

          if (!backupDir) {
            logBackup('Not Configured', BACKUP_NOT_CONFIGURED_MSG);
            return;
          }

          if (backups.length === 0) {
            logBackup('Backups', `No backups found in:\n${backupDir}\n\nClick "Backup Now" to create your first backup.`);
            return;
          }

          let html = `Backup directory: ${backupDir}\n\n`;
          html += `Found ${backups.length} backup(s):\n\n`;

          backups.forEach((backup, i) => {
            const sizeKB = (backup.size / 1024).toFixed(1);
            const sizeMB = (backup.size / (1024 * 1024)).toFixed(2);
            const sizeStr = backup.size > 1024 * 1024 ? `${sizeMB} MB` : `${sizeKB} KB`;
            const date = new Date(backup.date).toLocaleString();
            html += `${i + 1}. <span class="key">${backup.name}</span>\n   Size: ${sizeStr} | Date: ${date}\n\n`;
          });

          logBackup('Backups', html);
        } else {
          logBackup('List Failed', result.error || 'Unknown error', true);
        }
      } catch (err) {
        logBackup('List Error', err.message, true);
      }
    };

    window.openBackupFolder = async function() {
      try {
        const configResult = await api.backup.getConfig();
        if (!configResult.success) {
          logBackup('Error', 'Failed to get backup config: ' + configResult.error, true);
          return;
        }

        const backupDir = configResult.data.backupDir;
        if (!backupDir) {
          logBackup('Not Configured', BACKUP_NOT_CONFIGURED_MSG);
          return;
        }

        const result = await api.shell.openPath(backupDir);
        if (result.success) {
          logBackup('Opened', `Opened backup folder:\n${backupDir}`);
        } else {
          logBackup('Open Failed', result.error || 'Unknown error', true);
        }
      } catch (err) {
        logBackup('Open Error', err.message, true);
      }
    };

    // Auto-dump on load
    window.dumpBoth();
  </script>
</body>
</html>
