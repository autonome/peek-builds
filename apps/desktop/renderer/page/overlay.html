<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peek Page Overlay</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <!-- Import map for Lit (required by peek-navbar component) -->
  <script type="importmap">
  {
    "imports": {
      "lit": "peek://node_modules/lit/index.js",
      "lit/": "peek://node_modules/lit/",
      "lit-html": "peek://node_modules/lit-html/lit-html.js",
      "lit-html/": "peek://node_modules/lit-html/",
      "lit-element": "peek://node_modules/lit-element/lit-element.js",
      "lit-element/": "peek://node_modules/lit-element/",
      "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Fully transparent: the content BaseWindow shows through everywhere the
       * chrome doesn't paint. Click-through is enforced at the window level via
       * setIgnoreMouseEvents; here we additionally make the body region
       * pointer-events:none so ONLY the chrome elements are interactive. */
      background: transparent;
      pointer-events: none;
    }

    /* Trigger zone — transparent strip at the top of the window. Hover reveals
     * the navbar (matches the canvas page.js trigger-zone behavior). It must be
     * interactive (so hover is detected) — that is handled by the click-capture
     * IPC (see overlay.js): pointer enter over .interactive sets capture on. */
    .trigger-zone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      z-index: 50;
      pointer-events: auto;
    }

    peek-navbar {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 24px));
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    peek-navbar.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* P1.4b-3: resize handles. The overlay frames the content window's FULL
     * outer bounds, so the handles sit at the window edges/corners (the same
     * positions page.js uses in its MAXIMIZED layout, where the window has no
     * surrounding canvas margin — identical to the chrome-less hybrid window).
     * They are .interactive so the click-capture IPC turns the overlay opaque to
     * the pointer while a drag is in progress. */
    .resize-handle {
      position: absolute;
      width: 24px;
      height: 24px;
      z-index: 10;
      pointer-events: auto;
      touch-action: none;
    }
    .resize-handle[data-dir="se"] { right: 0; bottom: 0; cursor: se-resize; }
    .resize-handle[data-dir="sw"] { left: 0; bottom: 0; cursor: sw-resize; }
    .resize-handle[data-dir="ne"] { right: 0; top: 0; cursor: ne-resize; }
    .resize-handle[data-dir="nw"] { left: 0; top: 0; cursor: nw-resize; }
    /* Edge handles span between the corners. EDGE_HIT=6 matches page.js. */
    .resize-handle[data-dir="n"]  { left: 24px; right: 24px; top: 0; height: 6px; width: auto; cursor: n-resize; }
    .resize-handle[data-dir="s"]  { left: 24px; right: 24px; bottom: 0; height: 6px; width: auto; cursor: s-resize; }
    .resize-handle[data-dir="e"]  { right: 0; top: 24px; bottom: 24px; width: 6px; height: auto; cursor: e-resize; }
    .resize-handle[data-dir="w"]  { left: 0; top: 24px; bottom: 24px; width: 6px; height: auto; cursor: w-resize; }

    /* Drag-move surface: an invisible strip behind the navbar. Dragging it moves
     * the content window (mirrors page.js navbar-background instant-drag). It is
     * shown only while the navbar is visible. */
    .drag-zone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      z-index: 40;
      pointer-events: none;
    }
    body.chrome-visible .drag-zone {
      pointer-events: auto;
      cursor: grab;
    }
    body.chrome-visible .drag-zone.dragging { cursor: grabbing; }

    /* P1.4b-4: find-in-page bar. Top-right floating chip, mirrors the canvas
     * page.js find bar. It is .interactive so the click-capture path turns the
     * overlay opaque to the pointer while the user types/clicks in it. Hidden
     * by default (display:none) and shown by overlay.js on page:find. */
    .find-bar {
      position: absolute;
      top: 6px;
      right: 12px;
      z-index: 110;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      background: var(--theme-bg-secondary, rgba(30, 30, 30, 0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.2));
      box-shadow: var(--theme-surface-ring, 0 0 0 1px rgba(0, 0, 0, 0.5));
      border-radius: 10px;
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 14px;
      pointer-events: auto;
    }
    body.find-visible .find-bar { display: flex; }

    .find-bar input {
      background: var(--theme-bg-tertiary, rgba(128, 128, 128, 0.12));
      border: none;
      outline: none;
      color: var(--theme-text, #e0e0e0);
      font: inherit;
      padding: 5px 8px;
      border-radius: 6px;
      width: 180px;
      min-width: 0;
    }

    .find-bar .find-count {
      color: var(--theme-text-secondary, #aaa);
      font-size: 13px;
      min-width: 56px;
      text-align: right;
      white-space: nowrap;
    }

    .find-bar button {
      background: none;
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    .find-bar button:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }

    /* When there is no active window, hide everything (belt-and-suspenders on
     * top of main-side overlayWin.hide()). */
    body.no-active .trigger-zone,
    body.no-active .resize-handle,
    body.no-active .drag-zone,
    body.no-active .find-bar,
    body.no-active peek-navbar {
      display: none;
    }
  </style>
</head>
<body class="no-active" data-no-drag>
  <div class="trigger-zone interactive" id="trigger-zone"></div>
  <!-- P1.4b-3: window-interaction chrome. Handles + drag-zone are .interactive so
       the click-capture path turns the overlay opaque to the pointer over them. -->
  <div class="drag-zone interactive" id="drag-zone"></div>
  <div class="resize-handle interactive" data-dir="se"></div>
  <div class="resize-handle interactive" data-dir="sw"></div>
  <div class="resize-handle interactive" data-dir="ne"></div>
  <div class="resize-handle interactive" data-dir="nw"></div>
  <div class="resize-handle interactive" data-dir="n"></div>
  <div class="resize-handle interactive" data-dir="s"></div>
  <div class="resize-handle interactive" data-dir="e"></div>
  <div class="resize-handle interactive" data-dir="w"></div>
  <!-- P1.4b-4: find-in-page bar (mirrors the canvas page.js find UI). -->
  <div class="find-bar interactive" id="find-bar">
    <input type="text" id="find-input" placeholder="Find in page" spellcheck="false" autocomplete="off">
    <span class="find-count" id="find-count"></span>
    <button id="find-prev" title="Previous (Shift+Enter)">&#8593;</button>
    <button id="find-next" title="Next (Enter)">&#8595;</button>
    <button id="find-close" title="Close (Esc)">&#215;</button>
  </div>
  <script type="module">
    import 'peek://app/components/peek-navbar.js';
  </script>
  <peek-navbar id="navbar" class="interactive"></peek-navbar>
  <script type="module" src="overlay.js"></script>
</body>
</html>
