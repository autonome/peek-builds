<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peek Page Overlay</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <!-- Import map for Lit (required by peek-navbar component) -->
  <script type="importmap">
  {
    "imports": {
      "lit": "peek://node_modules/lit/index.js",
      "lit/": "peek://node_modules/lit/",
      "lit-html": "peek://node_modules/lit-html/lit-html.js",
      "lit-html/": "peek://node_modules/lit-html/",
      "lit-element": "peek://node_modules/lit-element/lit-element.js",
      "lit-element/": "peek://node_modules/lit-element/",
      "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Fully transparent: the content BaseWindow shows through everywhere the
       * chrome doesn't paint. Click-through is enforced at the window level via
       * setIgnoreMouseEvents; here we additionally make the body region
       * pointer-events:none so ONLY the chrome elements are interactive. */
      background: transparent;
      pointer-events: none;
    }

    /* Trigger zone — transparent strip above the inset content (in the top
     * gutter). Hover reveals the navbar (matches the canvas page.js trigger-zone
     * behavior). It must be interactive (so hover is detected) — that is handled
     * by the click-capture IPC (see overlay.js): pointer enter over .interactive
     * sets capture on. Position (left/top/width/height) is set by JS
     * (updateOverlayPositions) relative to the inner content rect. */
    .trigger-zone {
      position: absolute;
      z-index: 50;
      pointer-events: auto;
    }

    /* Navbar — sits in the top gutter, spanning the inset content width. Position
     * (left/top/width) is set by JS relative to the inner content rect. */
    peek-navbar {
      position: absolute;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    peek-navbar.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Round 2: no resize handles. Edge/corner resize (cursor + drag) is driven by
     * main against the content WebContents — the overlay can capture a press but
     * never paints a cursor (it is never the macOS first responder). See
     * ipc.ts wireHybridContentEvents. */

    /* Drag-move surface: an invisible strip behind the navbar (in the top gutter,
     * over the content width). Dragging it moves the content window (mirrors
     * page.js navbar-background instant-drag). Position is set by JS relative to
     * the content rect. Shown only while the navbar is visible. */
    .drag-zone {
      position: absolute;
      z-index: 40;
      pointer-events: none;
    }
    body.chrome-visible .drag-zone {
      pointer-events: auto;
      cursor: grab;
    }
    body.chrome-visible .drag-zone.dragging { cursor: grabbing; }

    /* P1.4b-4: find-in-page bar. Top-right floating chip, mirrors the canvas
     * page.js find bar. It is .interactive so the click-capture path turns the
     * overlay opaque to the pointer while the user types/clicks in it. Hidden
     * by default (display:none) and shown by overlay.js on page:find. */
    .find-bar {
      position: absolute;
      z-index: 110;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      background: var(--theme-bg-secondary, rgba(30, 30, 30, 0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.2));
      box-shadow: var(--theme-surface-ring, 0 0 0 1px rgba(0, 0, 0, 0.5));
      border-radius: 10px;
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 14px;
      pointer-events: auto;
    }
    body.find-visible .find-bar { display: flex; }

    .find-bar input {
      background: var(--theme-bg-tertiary, rgba(128, 128, 128, 0.12));
      border: none;
      outline: none;
      color: var(--theme-text, #e0e0e0);
      font: inherit;
      padding: 5px 8px;
      border-radius: 6px;
      width: 180px;
      min-width: 0;
    }

    .find-bar .find-count {
      color: var(--theme-text-secondary, #aaa);
      font-size: 13px;
      min-width: 56px;
      text-align: right;
      white-space: nowrap;
    }

    .find-bar button {
      background: none;
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    .find-bar button:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }

    /* ── P1.4b-5: side panels (page-info / tags / entities / extensions) ────────
     * REUSED verbatim from renderer/page/index.html (the canvas page.js chrome).
     * The overlay frames the active hybrid window's FULL outer bounds (no canvas
     * margin), so panels are pinned to the window edges directly: left stack
     * (page-info, then extensions below) at top-left, right stack (tags, then
     * entities) at top-right, both offset below the navbar/trigger zone. They are
     * .interactive so the click-capture path turns the overlay opaque to the
     * pointer over them. Shown only while chrome is visible (body.panels-visible),
     * hidden when there is no active window. */
    .page-info-panel, .tags-panel, .entities-panel, .extensions-panel {
      position: absolute;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      max-width: 280px;
      min-width: 200px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    /* Left stack (page-info, then extensions) lives in the LEFT gutter; right
     * stack (widgets, tags, notes, entities) in the RIGHT gutter. Each is
     * positioned (left/top) by JS (updateOverlayPositions) relative to the inner
     * content rect, with cumulative top offsets so panels STACK rather than pile
     * at the same top — exactly page.js's updatePositions rightStackTop math. */
    .page-info-panel,
    .extensions-panel,
    .tags-panel,
    .entities-panel { width: 280px; }

    body.panels-visible .page-info-panel.has-data,
    body.panels-visible .tags-panel.has-data,
    body.panels-visible .entities-panel.has-data,
    body.panels-visible .extensions-panel.has-data {
      opacity: 1;
      pointer-events: auto;
    }

    .page-info-panel .panel-header, .tags-panel .panel-header,
    .entities-panel .panel-header, .extensions-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .page-info-panel .panel-title, .tags-panel .panel-title,
    .entities-panel .panel-title, .extensions-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }

    .panel-toggle {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 9px;
      width: 14px;
      height: 14px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.15s;
      font-family: system-ui;
      line-height: 1;
    }
    .panel-toggle:hover { color: var(--theme-text-secondary, #aaa); }
    .panel-toggle.collapsed { transform: rotate(-90deg); }

    .panel-body-wrap {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.2s ease;
      overflow: hidden;
    }
    .panel-body-wrap.collapsed { grid-template-rows: 0fr; }
    .panel-body-wrap > * { overflow: hidden; min-height: 0; }

    .panel-action-btn {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 10px;
      font-family: inherit;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .panel-action-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      color: var(--theme-text, #fff);
    }
    .panel-action-btn:disabled { opacity: 0.5; cursor: default; }

    /* Page Info */
    .page-info-panel .panel-body { padding: 4px 10px 10px 10px; }
    .page-info-panel .info-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-border) 30%, transparent);
    }
    .page-info-panel .info-row:last-child { border-bottom: none; }
    .page-info-panel .info-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--theme-text-muted, #777);
    }
    .page-info-panel .info-value {
      font-size: 12px;
      color: var(--theme-text, #e0e0e0);
      word-break: break-word;
      line-height: 1.4;
    }
    .page-info-panel .info-value.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-info-panel .og-image-preview {
      width: 100%;
      max-height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 4px;
    }
    .page-info-panel .info-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 8px 0;
    }

    /* Tags */
    .tags-panel .panel-body { padding: 4px 10px 10px 10px; }
    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 6px;
    }
    .tags-list:empty { display: none; margin-bottom: 0; }
    .tag-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      color: var(--theme-text, #e0e0e0);
      font-size: 11px;
      font-family: inherit;
      padding: 3px 6px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      max-width: 100%;
      overflow: hidden;
    }
    .tag-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      border-color: color-mix(in srgb, var(--theme-border) 60%, transparent);
    }
    .tag-btn .tag-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-btn .tag-remove { font-size: 12px; line-height: 1; opacity: 0.5; transition: opacity 0.1s; flex-shrink: 0; }
    .tag-btn:hover .tag-remove { opacity: 1; color: #f87171; }
    .tags-input-row { position: relative; }
    .tags-input-wrapper { position: relative; }
    .tags-input {
      width: 100%;
      background: color-mix(in srgb, var(--theme-bg-tertiary) 30%, transparent);
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      border-radius: 5px;
      color: var(--theme-text, #e0e0e0);
      font-size: 11px;
      font-family: inherit;
      padding: 4px 6px;
      outline: none;
      transition: border-color 0.15s;
    }
    .tags-input:focus { border-color: var(--theme-accent, rgba(100, 150, 255, 0.5)); }
    .tags-input::placeholder { color: var(--theme-text-muted, #666); }
    .tags-suggestion {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 4px 6px;
      font-size: 11px;
      font-family: inherit;
      color: var(--theme-text-muted, #555);
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Entities */
    .entities-panel .panel-body { padding: 4px 10px 10px 10px; max-height: 400px; overflow-y: auto; }
    .entities-panel .entity-group { margin-bottom: 8px; }
    .entities-panel .entity-group:last-child { margin-bottom: 0; }
    .entities-panel .entity-group-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--theme-text-muted, #777);
      margin-bottom: 4px;
    }
    .entities-panel .entity-item {
      padding: 3px 0;
      font-size: 12px;
      color: var(--theme-text, #e0e0e0);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entities-panel .entity-badge {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .entities-panel .entity-badge.person { background: #6dca6d; }
    .entities-panel .entity-badge.organization { background: #5b9bd5; }
    .entities-panel .entity-badge.place { background: #e6a23c; }
    .entities-panel .entity-badge.email { background: #c084fc; }
    .entities-panel .entity-badge.phone { background: #f472b6; }
    .entities-panel .entity-badge.event { background: #fb923c; }
    .entities-panel .entity-badge.product { background: #67e8f9; }
    .entities-panel .entity-badge.date { background: #fbbf24; }
    .entities-panel .entity-badge.tracking_number { background: #a78bfa; }
    .entities-panel .entity-badge.other { background: #94a3b8; }
    .entities-panel .entity-count { font-size: 10px; color: var(--theme-text-muted, #777); margin-left: 6px; opacity: 0.7; }
    .entities-panel .entity-empty { color: var(--theme-text-muted, #555); font-style: italic; font-size: 11px; padding: 8px 0; }
    .entities-panel .entity-loading { color: var(--theme-text-muted, #666); font-size: 11px; padding: 8px 0; }

    /* Extensions */
    .extensions-panel .panel-body { padding: 4px 10px 10px 10px; max-height: 400px; overflow-y: auto; }
    .ext-loading { color: var(--theme-text-muted, #666); font-size: 11px; padding: 8px 0; }
    .ext-empty { color: var(--theme-text-muted, #555); font-style: italic; font-size: 11px; padding: 8px 0; }
    .ext-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 5px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-border) 30%, transparent);
    }
    .ext-item-header { display: flex; align-items: center; gap: 8px; }
    .ext-item:last-child { border-bottom: none; }
    .ext-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0.8;
    }
    .ext-info { flex: 1; min-width: 0; }
    .ext-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--theme-text, #e0e0e0);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ext-actions { display: flex; gap: 4px; }
    .ext-action-btn {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 11px;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .ext-action-btn:hover { background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18)); color: var(--theme-text, #fff); }
    .ext-toggle { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
    .ext-toggle input { opacity: 0; width: 0; height: 0; }
    .ext-toggle-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: color-mix(in srgb, var(--theme-border) 60%, transparent);
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .ext-toggle-track::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px; left: 2px; top: 2px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .ext-toggle input:checked + .ext-toggle-track { background: #4ade80; }
    .ext-toggle input:checked + .ext-toggle-track::before { transform: translateX(14px); }
    .ext-adblocker-status { font-size: 10px; color: var(--theme-text-muted, #777); }

    /* ── P1.4b-6: NOTES panel + page WIDGETS ────────────────────────────────────
     * REUSED verbatim from renderer/page/index.html (the canvas page.js chrome).
     * The Notes panel is mounted by overlay.js (PageNotesPane.getElement()) into
     * #notes-panel-anchor in the right stack (below entities); the widget host +
     * OpenSearch/space-mode widgets render into #widget-container. Both regions
     * are .interactive so the click-capture path turns the overlay opaque to the
     * pointer over them, and both swap/clear per active window (see overlay.js).
     *
     * Visibility follows the existing overlay panel convention: shown only while
     * the chrome is visible (body.panels-visible) and once the region has data
     * for the active window (.has-data) — NOT page.js's per-element `.visible`
     * toggling (the overlay is one renderer serving N windows). */

    /* Notes panel (right gutter stack — JS positions it below the other right
     * panels via updateOverlayPositions cumulative stacking). */
    .notes-panel {
      position: absolute;
      width: 280px;
      z-index: 140;
      pointer-events: none;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      border-radius: 10px;
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font, system-ui, sans-serif);
      font-size: 12px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.panels-visible .notes-panel.has-data {
      opacity: 1;
      pointer-events: auto;
    }
    .notes-panel .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    .notes-panel .panel-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
    }
    .notes-count {
      font-size: 10px;
      color: var(--theme-text-muted, #777);
      background: color-mix(in srgb, var(--theme-border) 30%, transparent);
      border-radius: 8px;
      padding: 1px 6px;
      min-width: 16px;
      text-align: center;
    }
    .notes-add-btn {
      background: none;
      border: 1px solid color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 4px;
      color: var(--theme-text-secondary, #aaa);
      font-size: 14px;
      line-height: 1;
      width: 22px;
      height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .notes-add-btn:hover {
      background: color-mix(in srgb, var(--theme-border) 30%, transparent);
      color: var(--theme-text, #e0e0e0);
    }
    .notes-body {
      padding: 4px 10px 10px 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .notes-body::-webkit-scrollbar { width: 4px; }
    .notes-body::-webkit-scrollbar-track { background: transparent; }
    .notes-body::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--theme-border) 50%, transparent);
      border-radius: 2px;
    }
    .notes-empty {
      color: var(--theme-text-muted, #555);
      font-style: italic;
      font-size: 11px;
      padding: 8px 0;
    }
    .notes-item {
      display: flex;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-border) 20%, transparent);
      cursor: pointer;
    }
    .notes-item:last-child { border-bottom: none; }
    .notes-item:hover {
      background: color-mix(in srgb, var(--theme-border) 10%, transparent);
      border-radius: 4px;
    }
    .notes-item-editing {
      background: color-mix(in srgb, var(--theme-border) 15%, transparent);
      border-radius: 4px;
    }
    .notes-text-wrap { flex: 1; min-width: 0; overflow: hidden; }
    .notes-anchor-text {
      font-size: 11px;
      color: var(--theme-text-muted, #888);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .notes-content-preview {
      font-size: 12px;
      color: var(--theme-text, #e0e0e0);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .notes-textarea {
      width: 100%;
      background: color-mix(in srgb, var(--base00) 60%, transparent);
      border: 1px solid color-mix(in srgb, var(--theme-border) 40%, transparent);
      border-radius: 4px;
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font, system-ui, sans-serif);
      font-size: 12px;
      padding: 6px 8px;
      resize: vertical;
      margin-top: 4px;
      outline: none;
    }
    .notes-textarea:focus { border-color: var(--theme-accent, #007aff); }
    .notes-textarea::placeholder { color: var(--theme-text-muted, #666); }
    .notes-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .notes-btn-delete {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      opacity: 0.5;
      transition: opacity 0.15s;
    }
    .notes-btn-delete:hover { opacity: 1; color: var(--base08, #f44); }
    .notes-btn-confirm { opacity: 1; color: var(--base09, #f80) !important; font-weight: bold; }

    /* Widget system (page widgets host + OpenSearch + space-mode). Right stack,
     * pinned top-right below the notes panel. The container is transparent to the
     * pointer; individual .widget cards are interactive. */
    .widget-container {
      position: absolute;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 140;
      pointer-events: none; /* Container itself is transparent to clicks */
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.panels-visible .widget-container.has-data { opacity: 1; }
    .widget {
      pointer-events: auto;
      background: color-mix(in srgb, var(--base00) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.08));
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 12px;
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .widget.visible { opacity: 1; }
    .widget.hiding { opacity: 0; }
    .widget-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 4px 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    .widget-title {
      flex: 1;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-secondary, #aaa);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .widget-toggle {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 9px;
      width: 14px;
      height: 14px;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.15s;
      font-family: system-ui;
      line-height: 1;
    }
    .widget-toggle:hover { color: var(--theme-text-secondary, #aaa); }
    .widget-toggle.collapsed { transform: rotate(-90deg); }
    .widget-body-wrap {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.2s ease;
      overflow: hidden;
    }
    .widget-body-wrap.collapsed { grid-template-rows: 0fr; }
    .widget-body-wrap > * { overflow: hidden; min-height: 0; }
    .widget-close {
      background: none;
      border: none;
      color: var(--theme-text-muted, #666);
      font-size: 14px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }
    .widget-close:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.12));
      color: var(--theme-text, #fff);
    }
    .widget-body { padding: 4px 10px 10px 10px; }
    .widget-engine-found { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .widget-engine-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .widget-engine-name {
      font-size: 13px;
      color: var(--theme-text, #e0e0e0);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .widget-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1));
      border: none;
      color: var(--theme-text-secondary, #bbb);
      font-size: 12px;
      font-family: inherit;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      width: 100%;
      justify-content: center;
    }
    .widget-action-btn:hover {
      background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.18));
      color: var(--theme-text, #fff);
    }
    .widget-action-btn.confirmed { color: #6dca6d; cursor: default; }
    .widget-action-btn.confirmed:hover { background: var(--theme-bg-tertiary, rgba(255, 255, 255, 0.1)); color: #6dca6d; }
    .space-mode-widget-body { display: flex; align-items: center; gap: 6px; }
    .space-mode-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .space-mode-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--theme-text-secondary, #aaa);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* When there is no active window, hide everything (belt-and-suspenders on
     * top of main-side overlayWin.hide()). */
    body.no-active .trigger-zone,
    body.no-active .drag-zone,
    body.no-active .find-bar,
    body.no-active .page-info-panel,
    body.no-active .tags-panel,
    body.no-active .entities-panel,
    body.no-active .extensions-panel,
    body.no-active .notes-panel,
    body.no-active .widget-container,
    body.no-active peek-navbar {
      display: none;
    }

    /* ── Permission prompt (web permission requests — geolocation, etc.) ────
     * Ported from the retired canvas page-host chrome (renderer/page/index.html,
     * see git history 2b14032d^) with overlay adaptations: the element is
     * dynamically created by overlay.js, positioned (left/top) by
     * updateOverlayPositions() at the top-center of the ACTIVE content rect
     * (the canvas used window-relative top:16px/left:50% — one window per page;
     * the overlay frames content + gutters, so JS anchors it to the content).
     * pointer-events:auto because the overlay body is pointer-events:none; the
     * element is .interactive and joins the click-capture loop so the overlay
     * window goes pointer-opaque while the user is over it. */
    .permission-prompt {
      position: fixed;
      transform: translateX(-50%);
      z-index: 200;
      width: max-content;
      max-width: 480px;
      background: color-mix(in srgb, var(--theme-bg-secondary, #2a2a2a) 95%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid color-mix(in srgb, var(--theme-border, rgba(255,255,255,0.1)) 80%, transparent);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      color: var(--theme-text, #e0e0e0);
      font-family: var(--theme-font-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 13px;
      pointer-events: auto;
      animation: permission-prompt-in 180ms ease-out;
    }

    @keyframes permission-prompt-in {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    body.no-active .permission-prompt {
      display: none;
    }

    .permission-prompt-message {
      margin-bottom: 10px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .permission-prompt-favicon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 1px;
      object-fit: contain;
    }

    .permission-prompt-text {
      flex: 1;
      min-width: 0;
    }

    .permission-prompt-origin {
      font-family: var(--theme-font-mono, ui-monospace, SFMono-Regular, monospace);
      font-weight: 600;
      color: var(--theme-text, #e0e0e0);
    }

    .permission-prompt-pending-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--theme-bg-tertiary, #2a2a2a) 80%, transparent);
      color: var(--theme-text-secondary, #aaa);
      font-size: 11px;
      font-weight: 500;
      vertical-align: middle;
    }

    .permission-prompt-remember {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--theme-text-secondary, #aaa);
      cursor: pointer;
      user-select: none;
    }

    .permission-prompt-remember input[type="checkbox"] {
      cursor: pointer;
      margin: 0;
    }

    .permission-prompt-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .permission-prompt-actions button {
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .permission-prompt-allow {
      background: var(--theme-accent, #007aff);
      color: #fff;
    }

    .permission-prompt-deny {
      background: color-mix(in srgb, var(--theme-bg-tertiary, #2a2a2a) 80%, transparent);
      color: var(--theme-text, #e0e0e0);
      border: 1px solid color-mix(in srgb, var(--theme-border, rgba(255,255,255,0.1)) 60%, transparent) !important;
    }

    .permission-prompt-actions button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body class="no-active" data-no-drag>
  <div class="trigger-zone interactive" id="trigger-zone"></div>
  <!-- P1.4b-3: window-move chrome. The drag-zone is .interactive so the
       click-capture path turns the overlay opaque to the pointer over it.
       (Resize handles are gone — edge/corner resize is main-driven; see ipc.ts.) -->
  <div class="drag-zone interactive" id="drag-zone"></div>
  <!-- P1.4b-4: find-in-page bar (mirrors the canvas page.js find UI). -->
  <div class="find-bar interactive" id="find-bar">
    <input type="text" id="find-input" placeholder="Find in page" spellcheck="false" autocomplete="off">
    <span class="find-count" id="find-count"></span>
    <button id="find-prev" title="Previous (Shift+Enter)">&#8593;</button>
    <button id="find-next" title="Next (Enter)">&#8595;</button>
    <button id="find-close" title="Close (Esc)">&#215;</button>
  </div>
  <!-- P1.4b-5: side panels (REUSED markup from renderer/page/index.html). They
       are .interactive so the click-capture path turns the overlay opaque to the
       pointer over them. overlay.js mounts/feeds/clears them per active window. -->
  <div class="page-info-panel interactive" id="page-info-panel">
    <div class="panel-header">
      <button class="panel-toggle" title="Collapse">&#x25BC;</button>
      <span class="panel-title">Page Info</span>
    </div>
    <div class="panel-body-wrap">
      <div class="panel-body" id="page-info-body">
        <div class="info-empty">Loading page info...</div>
      </div>
    </div>
  </div>

  <div class="extensions-panel interactive" id="extensions-panel">
    <div class="panel-header">
      <button class="panel-toggle" title="Collapse">&#x25BC;</button>
      <span class="panel-title">Extensions</span>
    </div>
    <div class="panel-body-wrap">
      <div class="panel-body" id="extensions-body">
        <div class="ext-loading">Loading extensions...</div>
      </div>
    </div>
  </div>

  <div class="tags-panel interactive" id="tags-panel">
    <div class="panel-header">
      <button class="panel-toggle" title="Collapse">&#x25BC;</button>
      <span class="panel-title">Tags</span>
    </div>
    <div class="panel-body-wrap">
      <div class="panel-body" id="tags-body">
        <div class="tags-list" id="tags-list"></div>
        <div class="tags-input-row">
          <div class="tags-input-wrapper">
            <input type="text" class="tags-input" id="tags-input" placeholder="Add tag..." autocomplete="off" spellcheck="false">
            <span class="tags-suggestion" id="tags-suggestion"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="entities-panel interactive" id="entities-panel">
    <div class="panel-header">
      <button class="panel-toggle" title="Collapse">&#x25BC;</button>
      <span class="panel-title">Entities</span>
      <button class="panel-action-btn" id="entities-rescan-btn" title="Re-extract entities">Rescan</button>
    </div>
    <div class="panel-body-wrap">
      <div class="panel-body" id="entities-body">
        <div class="entity-empty">No entities detected yet</div>
      </div>
    </div>
  </div>

  <!-- P1.4b-6: notes panel mount point (overlay.js replaces this with the
       PageNotesPane element + adds .interactive) and the page-widgets host
       container (OpenSearch + space-mode widgets render here). -->
  <div id="notes-panel-anchor"></div>
  <div class="widget-container interactive" id="widget-container"></div>

  <script type="module">
    import 'peek://app/components/peek-navbar.js';
  </script>
  <peek-navbar id="navbar" class="interactive"></peek-navbar>
  <script type="module" src="overlay.js"></script>
</body>
</html>
