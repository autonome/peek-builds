<!DOCTYPE html>
<html>
  <head>
    <title>peek:cmd:panel</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      @import url('peek://theme/variables.css');

      /* Translucent surface colors — light/dark aware */
      :root {
        --cmd-surface-bg: rgba(240, 240, 240, 0.95);
        --cmd-surface-hover: rgba(0, 0, 0, 0.06);
        --cmd-surface-selected: rgba(0, 0, 0, 0.1);
        --cmd-surface-divider: rgba(0, 0, 0, 0.08);
        --cmd-badge-bg: rgba(0, 0, 0, 0.08);
        --cmd-chain-bg: rgba(180, 200, 230, 0.95);
        --cmd-chain-steps-bg: rgba(210, 220, 235, 0.95);
        --cmd-exec-bg: rgba(180, 200, 230, 0.95);
        --cmd-exec-error-bg: rgba(230, 180, 180, 0.95);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --cmd-surface-bg: rgba(40, 44, 52, 0.95);
          --cmd-surface-hover: rgba(255, 255, 255, 0.1);
          --cmd-surface-selected: rgba(255, 255, 255, 0.2);
          --cmd-surface-divider: rgba(255, 255, 255, 0.1);
          --cmd-badge-bg: rgba(255, 255, 255, 0.1);
          --cmd-chain-bg: rgba(60, 80, 120, 0.95);
          --cmd-chain-steps-bg: rgba(50, 60, 80, 0.95);
          --cmd-exec-bg: rgba(60, 100, 160, 0.95);
          --cmd-exec-error-bg: rgba(160, 60, 60, 0.95);
        }
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
        font-family: var(--theme-font-sans);
        color: var(--theme-text, #333);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .center-wrapper {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 6px 10px;
        box-sizing: border-box;
        background-color: var(--cmd-surface-bg);
        border: var(--theme-surface-border, 1px solid rgba(255, 255, 255, 0.2));
        box-shadow: var(--theme-surface-ring, 0 0 0 1px rgba(0, 0, 0, 0.5));
        border-radius: 8px;
        margin: 5px 10px;
        width: calc(100% - 20px);
      }

      /* Command display wrapper */
      .command-display {
        flex: 1;
        min-width: 0;
        min-height: 28px;
        position: relative;
        display: flex;
        align-items: flex-start;
      }

      /* Command input field */
      #command-input {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 28px;
        line-height: 28px;
        border: none;
        outline: none;
        background: transparent;
        color: transparent;
        caret-color: transparent;
        font-family: inherit;
        font-size: 18px;
        font-weight: 500;
        padding: 0;
        box-sizing: border-box;

        z-index: 2;
      }

      #command-input::placeholder {
        color: var(--theme-text-muted, #999);
      }

      /* Suggestion element that shows the matching command with highlighting */
      #command-text {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 28px;
        line-height: 28px;
        font-family: inherit;
        font-size: 18px;
        font-weight: 300;
        color: var(--theme-text-muted, #999);
        white-space: pre;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
        padding: 0;
        box-sizing: border-box;
      }

      #command-text .typed {
        color: var(--theme-text, #333);
        font-weight: 500;
      }

      /* Styling for the matched part */
      #command-text .matched {
        text-decoration: underline;
      }

      /* Inline URL-completion suffix: highlighted (selected-style), NOT dimmed —
         mirrors the native selection on the transparent input beneath it. */
      #command-text .cmd-inline-selection {
        color: var(--theme-text, #333);
        font-weight: 500;
        background-color: var(--cmd-inline-selection-bg, rgba(102, 153, 204, 0.35));
        border-radius: 2px;
      }

      /* The real <input> text is transparent, but its ::selection would still
         paint an opaque OS highlight box on top of #command-text (input sits at
         a higher z-index). Suppress it so only the #command-text highlight shows;
         Backspace / type-over still delete the real selected suffix. */
      #command-input::selection {
        background: transparent;
      }

      /* Results list */
      #results {
        display: none;
        width: calc(100% - 20px);
        flex: 1;
        min-height: 0;
        max-height: 300px;
        overflow-y: auto;
        padding: 10px;
        margin: 5px 10px;
        box-sizing: border-box;

        background-color: var(--cmd-surface-bg);
        border-radius: 8px;
      }

      #results.visible {
        display: block;
      }

      .command-item {
        padding: 8px;
        cursor: pointer;
        border-radius: 4px;
      }

      .command-item:hover {
        background-color: var(--cmd-surface-hover);
      }

      .command-item.selected {
        background-color: var(--cmd-surface-selected);
      }

      /* Command item with description */
      .command-item .cmd-name {
        font-weight: 500;
      }

      .command-item .cmd-desc {
        font-size: 12px;
        color: var(--theme-text-secondary, #666);
        margin-left: 8px;
      }

      .command-item .cmd-badges {
        float: right;
        font-size: 10px;
        opacity: 0.6;
      }

      .command-item .cmd-badge {
        display: inline-block;
        padding: 2px 4px;
        border-radius: 3px;
        background: var(--cmd-badge-bg);
        margin-left: 4px;
      }

      /* Visited (URL history) lane section header */
      .results-section-header {
        padding: 6px 8px 2px;
        font-size: 11px;
        color: var(--theme-text-secondary, #666);
        opacity: 0.7;
        user-select: none;
      }

      /* URL mode result items */
      .url-result-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .url-favicon {
        flex-shrink: 0;
        border-radius: 2px;
      }

      .url-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .url-subtitle {
        flex-shrink: 0;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* A row whose page is open in a window: clicking the marker switches. */
      .url-open-marker {
        cursor: pointer;
        flex-shrink: 0;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 500;
        white-space: nowrap;
        background: rgba(0, 122, 255, 0.18);
        border: 1px solid rgba(0, 122, 255, 0.45);
        color: var(--theme-text, #333);
      }
      .url-open-marker:hover {
        background: rgba(0, 122, 255, 0.3);
      }

      /* URL results separator in normal cmd mode */
      .url-results-separator {
        padding: 4px 12px 2px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.5;
        user-select: none;
      }

      /* Chain indicator */
      #chain-indicator {
        display: none;
        align-items: center;
        padding: 8px 12px;
        margin: 10px 10px 5px 10px;
        background: var(--cmd-chain-bg);
        border-radius: 8px;
        font-size: 12px;
        gap: 8px;
        width: calc(100% - 20px);
        box-sizing: border-box;
      }

      #chain-indicator.visible {
        display: flex;
      }

      #chain-indicator #chain-mime {
        font-family: var(--theme-font-mono);
        background: var(--cmd-badge-bg);
        padding: 2px 6px;
        border-radius: 3px;
      }

      #chain-indicator #chain-title {
        color: var(--theme-text-secondary, #666);
        flex: 1;
      }

      #chain-indicator #chain-cancel {
        background: none;
        border: none;
        color: var(--theme-text-secondary, #666);
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;

      }

      #chain-indicator #chain-cancel:hover {
        color: var(--theme-text, #333);
        background: var(--cmd-surface-hover);
        border-radius: 3px;
      }

      /* Preview container */
      #preview-container {
        display: none;
        flex-shrink: 0;
        margin: 5px 10px;
        padding: 10px;
        background: var(--cmd-surface-bg);
        border-radius: 8px;
        max-height: 200px;
        overflow: auto;

        width: calc(100% - 20px);
        box-sizing: border-box;
      }

      #preview-container.visible {
        display: block;
      }

      #preview-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--cmd-surface-divider);
        margin-bottom: 8px;
        font-size: 11px;
      }

      #preview-mime {
        font-family: var(--theme-font-mono);
        background: var(--cmd-badge-bg);
        padding: 2px 6px;
        border-radius: 3px;
      }

      #preview-title {
        color: var(--theme-text-secondary, #666);
      }

      #preview-content {
        font-size: 12px;
      }

      #preview-content pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: var(--theme-font-mono);
        font-size: 11px;
        line-height: 1.4;
      }

      #preview-content .preview-json {
        color: var(--base0B, #34c759);
      }

      #preview-content .preview-csv {
        width: 100%;
        border-collapse: collapse;
      }

      #preview-content .preview-csv td {
        padding: 4px 8px;
        border: 1px solid var(--cmd-surface-divider);
      }

      #preview-content .preview-csv tr:first-child td {
        background: var(--cmd-surface-hover);
        font-weight: 500;
      }

      #preview-content .preview-plain {
        color: var(--theme-text, #333);
      }

      #preview-content .preview-error {
        color: var(--base08, #ff3b30);
      }

      /* Preview table for JSON arrays of objects */
      #preview-content .preview-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }

      #preview-content .preview-table th {
        text-align: left;
        padding: 6px 8px;
        background: var(--cmd-surface-hover);
        border: 1px solid var(--cmd-surface-divider);
        font-weight: 500;
        color: var(--theme-text, #333);
      }

      #preview-content .preview-table td {
        padding: 4px 8px;
        border: 1px solid var(--cmd-surface-divider);
        color: var(--theme-text-secondary, #666);
      }

      #preview-content .preview-table tr:hover td {
        background: var(--cmd-surface-hover);
      }

      /* Preview list for simple arrays */
      #preview-content .preview-list {
        line-height: 1.6;
      }

      #preview-content .preview-list-item {
        padding: 2px 0;
        color: var(--theme-text, #333);
      }

      #preview-content .preview-more {
        padding-top: 6px;
        color: var(--theme-text-muted, #999);
        font-style: italic;
        font-size: 10px;
      }

      /* Execution state indicator */
      #execution-state {
        display: none;
        align-items: center;
        padding: 8px 12px;
        margin: 10px 10px 5px 10px;
        background: var(--cmd-exec-bg);
        border-radius: 8px;
        font-size: 13px;
        gap: 10px;
        width: calc(100% - 20px);
        box-sizing: border-box;
      }

      #execution-state.visible {
        display: flex;
      }

      #execution-state.error {
        background: var(--cmd-exec-error-bg);
      }

      #execution-state .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--theme-text-muted, #999);
        border-top-color: var(--theme-text, #333);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #execution-state .exec-text {
        flex: 1;
        color: var(--theme-text, #333);
      }

      #execution-state .exec-error {
        color: var(--base08, #ff3b30);
      }

      #execution-state .exec-cancel {
        background: none;
        border: none;
        color: var(--theme-text-secondary, #666);
        cursor: pointer;
        font-size: 12px;
        padding: 2px 8px;

      }

      #execution-state .exec-cancel:hover {
        color: var(--theme-text, #333);
        background: var(--cmd-surface-hover);
        border-radius: 3px;
      }

      /* Mode indicator - tag button style.
         Hidden globally: the chip is currently disabled in the UI. JS
         continues to update its data-mode attribute (panel.js
         updateModeIndicator) so re-enabling later is just flipping
         display back to flex. */
      .mode-indicator {
        display: none;
        align-items: center;
        padding: 4px 10px;
        background: var(--cmd-badge-bg);
        border: 1px solid var(--cmd-surface-divider);
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
        color: var(--theme-text, #333);
        cursor: pointer;
        transition: all 0.15s ease;
        margin-right: 10px;
        flex-shrink: 0;

        user-select: none;
      }

      .mode-indicator:hover {
        background: var(--cmd-surface-selected);
        border-color: var(--cmd-surface-divider);
      }

      .mode-indicator:active {
        background: var(--cmd-surface-selected);
        transform: scale(0.98);
      }

      .mode-indicator .mode-label {
        text-transform: capitalize;
      }

      /* Mode-specific colors */
      .mode-indicator[data-mode="page"] {
        background: rgba(102, 153, 204, 0.4);
        border-color: rgba(102, 153, 204, 0.6);
      }

      .mode-indicator[data-mode="group"] {
        background: rgba(153, 102, 204, 0.4);
        border-color: rgba(153, 102, 204, 0.6);
      }

      .mode-indicator[data-mode="settings"] {
        background: rgba(204, 153, 102, 0.4);
        border-color: rgba(204, 153, 102, 0.6);
      }

      .mode-indicator[data-mode="url"] {
        background: rgba(52, 199, 89, 0.4);
        border-color: rgba(52, 199, 89, 0.6);
      }

      /* URL action button at the right end of the input (Cmd+Enter). */
      #url-action {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
        margin-left: 8px;
        padding: 3px 8px;
        height: 26px;
        box-sizing: border-box;
        background: rgba(0, 122, 255, 0.18);
        border: 1px solid rgba(0, 122, 255, 0.45);
        border-radius: 6px;
        color: var(--theme-text, #333);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
      }
      #url-action[hidden] { display: none; }
      #url-action:hover { background: var(--cmd-surface-selected); }
      #url-action:active { transform: scale(0.98); }
      #url-action .icon-window { display: block; }
      #url-action kbd {
        font-family: inherit;
        font-size: 11px;
        color: var(--theme-text-muted, #999);
      }

      /* Chain steps - shows the pipe history */
      #chain-steps {
        display: none;
        padding: 6px 12px;
        margin: 5px 10px 0 10px;
        background: var(--cmd-chain-steps-bg);
        border-radius: 8px;
        font-size: 11px;
        font-family: var(--theme-font-mono);
        color: var(--theme-text-secondary, #666);
        width: calc(100% - 20px);
        box-sizing: border-box;
        white-space: nowrap;
        overflow-x: auto;
      }

      #chain-steps.visible {
        display: block;
      }

      #chain-steps .chain-step {
        color: var(--theme-text-secondary, #666);
      }

      #chain-steps .chain-step.active {
        color: var(--base0D, #007aff);
        font-weight: 600;
      }

      #chain-steps .chain-arrow {
        color: var(--theme-text-muted, #999);
        margin: 0 6px;
      }

    </style>
  </head>
  <body>
    <!-- Execution state - shown when a command is running -->
    <div id="execution-state">
      <div class="spinner"></div>
      <span class="exec-text">Running...</span>
      <button class="exec-cancel" title="Cancel">Cancel</button>
    </div>

    <!-- Chain indicator - shown when in chain mode -->
    <div id="chain-indicator">
      <span id="chain-mime"></span>
      <span id="chain-title"></span>
      <button id="chain-cancel" title="Exit chain mode (Escape)">×</button>
    </div>

    <div class="center-wrapper">
      <div id="mode-indicator" class="mode-indicator" data-no-drag title="Click to cycle modes">
        <span class="mode-label">default</span>
      </div>
      <div class="command-display">
        <input id="command-input" type="text" autofocus spellcheck="false" autocomplete="off" placeholder="Feed meeeee" />
        <div id="command-text"></div>
      </div>
      <!-- URL action: switch to the window already showing the panel's web
           address (also Cmd+Enter). panel.js renderUrlAction() shows it with
           data-action="switch" only while such a window is open, and hides it
           otherwise. -->
      <button id="url-action" type="button" data-no-drag hidden tabindex="-1">
        <span class="url-action-label">Switch to</span>
        <svg class="icon-window" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 9h18" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <kbd>⌘↵</kbd>
      </button>
    </div>
    <div id="results"></div>

    <!-- Chain steps - shows the pipe history -->
    <div id="chain-steps"></div>

    <!-- Preview container - shown when viewing chained data -->
    <div id="preview-container">
      <div id="preview-header">
        <span id="preview-mime"></span>
        <span id="preview-title"></span>
      </div>
      <div id="preview-content"></div>
    </div>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
