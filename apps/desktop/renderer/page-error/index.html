<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page failed to load</title>
  <link rel="stylesheet" href="peek://theme/variables.css">
  <script type="importmap">
  {
    "imports": {
      "lit": "peek://node_modules/lit/index.js",
      "lit/": "peek://node_modules/lit/",
      "lit-html": "peek://node_modules/lit-html/lit-html.js",
      "lit-html/": "peek://node_modules/lit-html/",
      "lit-element": "peek://node_modules/lit-element/lit-element.js",
      "lit-element/": "peek://node_modules/lit-element/",
      "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
    }
  }
  </script>
  <script type="module">
    import 'peek://app/components/peek-button.js';
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--base00, #1a1a2e);
      color: var(--base05, #ddd);
      font-family: var(--font-family, system-ui, -apple-system, sans-serif);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main { max-width: 560px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 20px; font-weight: 600; }
    p { font-size: 14px; line-height: 1.5; opacity: 0.8; }
    .address {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
      word-break: break-all;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--base01, rgba(255, 255, 255, 0.06));
    }
    .code { font-size: 12px; opacity: 0.5; }
    .actions { margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="reason"></p>
    <div class="address" id="address"></div>
    <p class="code" id="code"></p>
    <div class="actions">
      <peek-button id="retry" variant="primary">Retry</peek-button>
    </div>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const failed = q.get('url') || '';
    document.getElementById('title').textContent = q.get('title') || 'Page failed to load';
    document.getElementById('reason').textContent = q.get('reason') || '';
    document.getElementById('address').textContent = failed;
    const desc = q.get('desc');
    document.getElementById('code').textContent = desc ? `${desc} (${q.get('code')})` : '';
    // Retry navigates the content area back to the failed address. A garbage
    // address fails the same way again and returns here.
    document.getElementById('retry').addEventListener('click', () => {
      // A string that is not an absolute address would resolve against this
      // page, so it is never navigated to; the address can only be edited.
      try { location.href = new URL(failed).href; } catch (e) { /* not a valid address */ }
    });
  </script>
</body>
</html>
