<!DOCTYPE html>
<!--
  peek-bridge.html — hidden bridge page for cross-origin page → BG SW IPC.

  This page is copied into each loaded extension's directory by
  scripts/patch-chrome-extensions.js and loaded as a hidden BrowserWindow at
  chrome-extension://<ext-id>/peek-bridge.html by chrome-extensions.ts.

  The bridge logic lives in peek-bridge.js (separate file, not inline) because
  MV3 extensions ship a strict CSP `script-src 'self' 'wasm-unsafe-eval'` that
  blocks inline <script> blocks even on extension-origin pages.

  Architecture:
    cross-origin page
      → ipcRenderer.invoke('peek:runtime-external:send')   [runtime-external-preload.cjs]
      → ipcMain handler                                     [runtime-external.js setupMainProcess]
      → bridgeWin.webContents.send('peek:auth-ext:forward') [runtime-external.js]
      → window.peekBridge.onForward(...)                    [this page, via peek-bridge-preload.cjs]
      → port.postMessage(payload)                           [chrome.runtime.Port to BG SW]
      → chrome.runtime.onMessageExternal listeners          [BG SW]
      → port.onMessage reply                                [BG SW → this page]
      → ipcRenderer.send('peek:auth-ext:response')          [peek-bridge-preload.cjs]
      → ipcMain response listener                           [runtime-external.js]
      → ipcRenderer.invoke resolved                         [runtime-external-preload.cjs]
      → page callback                                       [cross-origin page]

  Extension pages (chrome-extension:// origin) have native same-extension
  chrome.runtime.connect() which does reach the BG SW — unlike cross-origin
  page contexts where Electron 40's externally_connectable dispatch is broken.
-->
<html>
<head>
  <meta charset="UTF-8">
  <title>Peek Auth Bridge</title>
</head>
<body>
<script src="peek-bridge.js" charset="UTF-8"></script>
</body>
</html>
