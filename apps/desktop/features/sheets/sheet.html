<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Sheet</title>
    <link rel="stylesheet" type="text/css" href="sheet.css">
    <!-- The see-through look, inert until main puts `see-through` on <body>. -->
    <link rel="stylesheet" type="text/css" href="peek://app/lib/see-through.css">

    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
    {
      "imports": {
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-grid.js';
      import 'peek://app/components/peek-grid-toolbar.js';
    </script>
  </head>
  <body>
    <div class="sheet-header">
      <h1 class="sheet-title">Sheet</h1>
      <div class="sheet-actions">
        <button class="btn btn-add" style="display:none;">+ Add Card</button>
        <button class="btn btn-edit">Edit</button>
      </div>
    </div>

    <peek-grid class="cards" view-mode="freeform" freeform-snap="20" gap="12"></peek-grid>

    <div class="add-dialog" style="display:none;">
      <div class="add-dialog-backdrop"></div>
      <div class="add-dialog-content">
        <h2>Add Card</h2>
        <input type="text" class="add-dialog-input" placeholder="Enter URL (peek:// or https://)" />
        <div class="add-dialog-buttons">
          <button class="btn btn-cancel">Cancel</button>
          <button class="btn btn-confirm">Add</button>
        </div>
      </div>
    </div>

    <script type="module" src="sheet.js"></script>
  </body>
</html>
