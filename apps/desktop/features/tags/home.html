<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Tags</title>
    <link rel="stylesheet" type="text/css" href="home.css">

    <!-- Import map for resolving bare module specifiers -->
    <!-- @tanstack/virtual-core is served from a build-time-patched copy at
         peek://app/lib/virtual-core/index.js where process.env.NODE_ENV has
         been replaced with "production" (see scripts/patch-virtual-core.js).
         This avoids the need for a globalThis.process shim in the renderer. -->
    <script type="importmap">
    {
      "imports": {
        "@tanstack/virtual-core": "peek://app/lib/virtual-core/index.js",
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/",
        "@codemirror/state": "peek://node_modules/@codemirror/state/dist/index.js",
        "@codemirror/view": "peek://node_modules/@codemirror/view/dist/index.js",
        "@codemirror/commands": "peek://node_modules/@codemirror/commands/dist/index.js",
        "@codemirror/language": "peek://node_modules/@codemirror/language/dist/index.js",
        "@codemirror/autocomplete": "peek://node_modules/@codemirror/autocomplete/dist/index.js",
        "@codemirror/lang-markdown": "peek://node_modules/@codemirror/lang-markdown/dist/index.js",
        "@codemirror/lang-html": "peek://node_modules/@codemirror/lang-html/dist/index.js",
        "@codemirror/lang-css": "peek://node_modules/@codemirror/lang-css/dist/index.js",
        "@codemirror/lang-javascript": "peek://node_modules/@codemirror/lang-javascript/dist/index.js",
        "@codemirror/theme-one-dark": "peek://node_modules/@codemirror/theme-one-dark/dist/index.js",
        "@codemirror/search": "peek://node_modules/@codemirror/search/dist/index.js",
        "@replit/codemirror-vim": "peek://node_modules/@replit/codemirror-vim/dist/index.js",
        "@lezer/common": "peek://node_modules/@lezer/common/dist/index.js",
        "@lezer/highlight": "peek://node_modules/@lezer/highlight/dist/index.js",
        "@lezer/lr": "peek://node_modules/@lezer/lr/dist/index.js",
        "@lezer/markdown": "peek://node_modules/@lezer/markdown/dist/index.js",
        "@lezer/html": "peek://node_modules/@lezer/html/dist/index.js",
        "@lezer/css": "peek://node_modules/@lezer/css/dist/index.js",
        "@lezer/javascript": "peek://node_modules/@lezer/javascript/dist/index.js",
        "crelt": "peek://node_modules/crelt/index.js",
        "style-mod": "peek://node_modules/style-mod/src/style-mod.js",
        "w3c-keyname": "peek://node_modules/w3c-keyname/index.js",
        "@marijn/find-cluster-break": "peek://node_modules/@marijn/find-cluster-break/src/index.js"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-grid.js';
      import 'peek://app/components/peek-input.js';
      import 'peek://app/components/peek-button.js';
      import 'peek://app/components/peek-button-group.js';
      import 'peek://app/components/peek-grid-toolbar.js';
    </script>
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <h1 class="header-title">Tags</h1>
        <span class="active-tag-indicator"></span>
      </div>
      <div class="filter-icons">
        <button class="filter-btn" data-filter="page" title="Pages">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="filter-count" data-count="page">0</span>
        </button>
        <button class="filter-btn" data-filter="text" title="Notes">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span class="filter-count" data-count="text">0</span>
        </button>
        <button class="filter-btn" data-filter="tagset" title="Tag Sets">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
          <span class="filter-count" data-count="tagset">0</span>
        </button>
        <button class="filter-btn" data-filter="image" title="Images">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span class="filter-count" data-count="image">0</span>
        </button>
        <button class="filter-btn" data-filter="entity" title="Entities (People, Places, Orgs)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="filter-count" data-count="entity">0</span>
        </button>
      </div>
      <button class="add-item-btn" title="Add item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <div class="search-container">
      <peek-input
        class="search-input"
        placeholder="Search content, titles, and tags..."
        type="search"
      ></peek-input>
    </div>

    <div class="content-wrapper">
      <aside class="tag-sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">Tags</h2>
          <button class="sidebar-sort-btn" data-sort="name" title="Sort alphabetically">A↓</button>
          <button class="sidebar-sort-btn" data-sort="direction" title="Reverse sort order">↕</button>
        </div>
        <div class="tag-list"></div>
      </aside>

      <main class="items-container">
        <!-- Selected tags bar -->
        <div class="selected-tags-bar"></div>
        <!-- Tag management panel -->
        <div class="tag-manage-panel"></div>
        <!-- Grid toolbar -->
        <peek-grid-toolbar class="grid-toolbar" view-mode="columns"></peek-grid-toolbar>

        <!-- Card grid view (list) -->
        <peek-grid class="cards" min-item-width="120" gap="6"></peek-grid>

        <!-- Inline detail view (replaces card grid when an item is selected) -->
        <div class="detail-view" style="display: none;">
          <div class="detail-header">
            <img class="detail-favicon" alt="">
            <div class="detail-header-info">
              <div class="detail-title"></div>
              <div class="detail-url"></div>
            </div>
          </div>

          <div class="detail-actions"></div>

          <div class="detail-editor-section" style="display: none;">
            <div class="detail-editor-header">
              <label class="detail-label">Content</label>
              <span class="detail-save-status"></span>
            </div>
            <div class="detail-editor-container"></div>
          </div>

          <div class="detail-section">
            <label class="detail-label">Current Tags</label>
            <div class="current-tags"></div>
          </div>

          <div class="detail-section">
            <label class="detail-label">Search or add tag</label>
            <div class="new-tag-row">
              <peek-input class="new-tag-input" placeholder="Type to filter or create…"></peek-input>
              <peek-button class="add-tag-btn" variant="primary" size="sm">Add</peek-button>
            </div>
            <div class="available-tags"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="home.js"></script>
  </body>
</html>
