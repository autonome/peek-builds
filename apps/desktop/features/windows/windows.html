<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Windows</title>
    <link rel="stylesheet" type="text/css" href="windows.css">

    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
    {
      "imports": {
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-grid.js';
      import 'peek://app/components/peek-input.js';
      import 'peek://app/components/peek-button.js';
      import 'peek://app/components/peek-grid-toolbar.js';
    </script>
  </head>
  <body>
    <div class="search-container">
      <peek-input
        class="search-input"
        placeholder="Search windows..."
        type="search"
      ></peek-input>
      <peek-button
        class="hidden-toggle"
        variant="secondary"
        toggle
        label="Show hidden windows"
        title="Show hidden windows"
      >
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M1.5 9s2.75-5 7.5-5 7.5 5 7.5 5-2.75 5-7.5 5-7.5-5-7.5-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="9" cy="9" r="2.25" stroke="currentColor" stroke-width="1.5"/>
          <path class="hidden-toggle-slash" d="M3 15L15 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </peek-button>
    </div>

    <peek-grid-toolbar class="grid-toolbar" view-mode="fit"></peek-grid-toolbar>
    <peek-grid class="cards" view-mode="fit" min-item-width="250" gap="72"></peek-grid>

    <script type="module" src="windows.js"></script>
  </body>
</html>
