<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Features</title>
    <link rel="stylesheet" type="text/css" href="manage.css">

    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
    {
      "imports": {
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-button.js';
      import 'peek://app/components/peek-input.js';
      import 'peek://app/components/peek-select.js';
      import 'peek://app/components/peek-switch.js';
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-grid.js';
    </script>
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <h1 class="header-title">Features</h1>
        <span class="feature-count"></span>
      </div>
      <div class="header-right">
        <peek-button id="create-feature-btn" title="Create a new feature from scratch">
          Create Feature
        </peek-button>
        <peek-button id="add-from-folder-btn" title="Add a feature from an existing folder">
          Add from folder
        </peek-button>
        <peek-button id="check-updates-btn" title="Check all features for updates">
          Check for Updates
        </peek-button>
      </div>
    </header>

    <div class="create-feature-form" id="create-feature-form" style="display:none;">
      <div class="create-feature-header">
        <h2 class="create-feature-title">Create New Feature</h2>
        <peek-button size="sm" id="create-cancel-btn">Cancel</peek-button>
      </div>
      <div class="create-feature-body">
        <div class="create-field">
          <label class="create-label">Directory</label>
          <div class="create-dir-row">
            <span class="create-dir-path" id="create-dir-path">No directory selected</span>
            <peek-button id="create-pick-dir-btn">Choose...</peek-button>
          </div>
        </div>
        <div class="create-field">
          <label class="create-label" for="create-feature-id">Feature ID</label>
          <peek-input class="create-input" type="text" id="create-feature-id" placeholder="my-feature"></peek-input>
          <span class="create-hint">Lowercase, alphanumeric + hyphens</span>
        </div>
        <div class="create-field">
          <label class="create-label" for="create-feature-name">Feature Name</label>
          <peek-input class="create-input" type="text" id="create-feature-name" placeholder="My Feature"></peek-input>
        </div>
      </div>
      <div class="create-feature-footer">
        <peek-button variant="primary" id="create-submit-btn" disabled>Create</peek-button>
      </div>
    </div>

    <div class="install-bar">
      <peek-input
        class="install-input"
        placeholder="at://did:plc:.../space.peek.feature.release/..."
        type="text"
        id="install-uri-input"
      ></peek-input>
      <peek-button variant="primary" id="install-btn">Install</peek-button>
    </div>

    <div class="install-preview" id="install-preview" style="display:none;">
      <div class="install-preview-header">
        <h2 class="install-preview-title" id="preview-title">Feature Name</h2>
        <peek-button size="sm" id="preview-close">Cancel</peek-button>
      </div>
      <div class="install-preview-body">
        <div class="preview-meta" id="preview-meta"></div>
        <div class="preview-capabilities" id="preview-capabilities"></div>
      </div>
      <div class="install-preview-footer">
        <peek-button id="preview-cancel">Cancel</peek-button>
        <peek-button variant="primary" id="preview-install">Install</peek-button>
      </div>
    </div>

    <div class="install-status" id="install-status" style="display:none;">
      <span class="install-status-text" id="install-status-text"></span>
    </div>

    <div class="search-container">
      <peek-input
        class="search-input"
        placeholder="Filter installed features..."
        type="search"
        id="search-input"
      ></peek-input>
    </div>

    <div class="content" id="content">
      <div class="loading">Loading features...</div>
    </div>

    <div class="update-footer" id="update-footer" style="display:none;">
      <span class="update-footer-text" id="update-footer-text"></span>
    </div>

    <!-- Install History (collapsible) -->
    <div class="history-section" id="history-section">
      <button class="history-toggle" id="history-toggle" aria-expanded="false">
        Install History
        <span class="history-toggle-arrow">&#9654;</span>
      </button>
      <div class="history-content" id="history-content" style="display:none;"></div>
    </div>

    <!-- Capability review modal -->
    <div class="cap-review-overlay" id="cap-review-overlay" style="display:none;">
      <div class="cap-review-modal">
        <div class="cap-review-header">
          <h2 class="cap-review-title" id="cap-review-title">Review Required</h2>
        </div>
        <div class="cap-review-body">
          <p class="cap-review-desc" id="cap-review-desc"></p>
          <div class="cap-review-changes" id="cap-review-changes"></div>
        </div>
        <div class="cap-review-footer">
          <peek-button id="cap-review-dismiss">Dismiss</peek-button>
          <peek-button variant="primary" id="cap-review-approve">Approve &amp; Update</peek-button>
        </div>
      </div>
    </div>

    <script type="module" src="manage.js"></script>
  </body>
</html>
