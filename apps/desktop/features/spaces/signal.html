<!DOCTYPE html>
<!--
  The per-space desktop marker page (docs/design/space-desktop-return-plan.md):
  loaded by the 2x2 transparent window a space leaves on its desktop so that
  re-entering the space can switch macOS back there by raising it
  (background.js openSignalWindow()). Deliberately empty and deliberately NOT
  home.html: the marker must never match a selector, window count, or page
  pick that means the spaces home UI.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>space marker</title>
    <style>
      html, body { background: transparent; margin: 0; }
    </style>
  </head>
  <body></body>
</html>
