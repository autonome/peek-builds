<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Space Border</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }
    .border {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(to left, var(--color, #007aff), transparent);
      pointer-events: none;
    }
    .label {
      position: fixed;
      right: 14px;
      bottom: 12px;
      background: var(--color, #007aff);
      color: #fff;
      font: 500 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 3px 10px;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="border" id="border"></div>
  <div class="label" id="label"></div>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const color = params.get('color') || '#007aff';
    const name = params.get('name') || 'Space';

    document.documentElement.style.setProperty('--color', color);
    document.getElementById('label').textContent = name;

    // Listen for updates from background.js
    if (window.app) {
      const api = window.app;
      if (typeof api.initialize === 'function') {
        await api.initialize();
      }
      api.pubsub.subscribe('spaces:border-update', (msg) => {
        if (msg.color) {
          document.documentElement.style.setProperty('--color', msg.color);
        }
        if (msg.name) {
          document.getElementById('label').textContent = msg.name;
        }
      });
    }
  </script>
</body>
</html>
