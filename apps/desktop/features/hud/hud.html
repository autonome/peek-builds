<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
  <title>Peek HUD</title>
  <!-- Theme variables. tile-preload.cts re-injects this stylesheet on
       tile:theme:changed, so a theme or colour-scheme switch restyles the
       open HUD without a reload. -->
  <link rel="stylesheet" href="peek://theme/variables.css">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 10px 12px;
      font-family: var(--theme-font-sans, system-ui, sans-serif);
      font-size: 11px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background: var(--theme-bg, Canvas);
      color: var(--theme-text, CanvasText);
    }
    .total {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .caption { color: var(--theme-text-secondary, GrayText); margin-bottom: 6px; }
    .caption.section { margin: 8px 0 2px; }
    /* Floated rather than a flex row: a display value on the caption would override its hidden attribute. */
    .caption .column-heads { float: right; }
    .stats {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0 12px;
    }
    .stats .label { color: var(--theme-text-secondary, GrayText); }
    .stats .value { text-align: right; font-variant-numeric: tabular-nums; }
    .close {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--theme-text-secondary, GrayText);
      font-size: 14px;
      line-height: 18px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .close[hidden] { display: none; }
    .close:hover { color: var(--theme-text, CanvasText); background: color-mix(in srgb, currentColor 15%, transparent); }
  </style>
</head>
<body>
  <button id="close-hud" class="close" type="button" title="Close" aria-label="Close">&times;</button>
  <div class="caption">Peek memory, all processes</div>
  <div id="memory-total" class="total">-</div>
  <div class="stats">
    <span class="label">Processes</span><span id="process-count" class="value">-</span>
  </div>
  <div id="by-type" class="stats"></div>
  <div id="other-stats" class="stats"></div>
  <div id="windows-title" class="caption section" hidden>Windows<span class="column-heads">Shown/Hidden</span></div>
  <div id="window-kinds" class="stats"></div>
  <script type="module" src="hud.js"></script>
</body>
</html>
