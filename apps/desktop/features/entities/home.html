<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; connect-src https: http:; worker-src blob:;">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <title>Entities</title>
    <link rel="stylesheet" type="text/css" href="home.css">
    <!-- The see-through look, inert until main puts `see-through` on <body>. -->
    <link rel="stylesheet" type="text/css" href="peek://app/lib/see-through.css">

    <!-- Import map for resolving bare module specifiers -->
    <script type="importmap">
    {
      "imports": {
        "lit": "peek://node_modules/lit/index.js",
        "lit/": "peek://node_modules/lit/",
        "lit-html": "peek://node_modules/lit-html/lit-html.js",
        "lit-html/": "peek://node_modules/lit-html/",
        "lit-element": "peek://node_modules/lit-element/lit-element.js",
        "lit-element/": "peek://node_modules/lit-element/",
        "@lit/reactive-element": "peek://node_modules/@lit/reactive-element/reactive-element.js",
        "@lit/reactive-element/": "peek://node_modules/@lit/reactive-element/"
      }
    }
    </script>

    <!-- Import peek-components -->
    <script type="module">
      import 'peek://app/components/peek-card.js';
      import 'peek://app/components/peek-grid.js';
      import 'peek://app/components/peek-input.js';
      import 'peek://app/components/peek-button.js';
      import 'peek://app/components/peek-button-group.js';
      import 'peek://app/components/peek-grid-toolbar.js';
    </script>
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <h1 class="header-title">Entities <span class="header-count" id="entityCount"></span></h1>
      </div>
      <peek-button id="extractBtn" variant="ghost" size="sm">Extract Current Page</peek-button>
    </header>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-type="">All</button>
      <button class="filter-btn" data-type="person">People</button>
      <button class="filter-btn" data-type="organization">Orgs</button>
      <button class="filter-btn" data-type="place">Places</button>
      <button class="filter-btn" data-type="event">Events</button>
      <button class="filter-btn" data-type="email">Emails</button>
      <button class="filter-btn" data-type="phone">Phones</button>
      <button class="filter-btn" data-type="date">Dates</button>
      <button class="filter-btn" data-type="product">Products</button>
    </div>

    <div class="search-container">
      <peek-input
        class="search-input"
        id="searchInput"
        placeholder="Search entities..."
        type="search"
      ></peek-input>
    </div>

    <div class="content">
      <peek-grid-toolbar class="grid-toolbar" id="gridToolbar" view-mode="columns"></peek-grid-toolbar>
      <peek-grid id="entityGrid" min-item-width="250" gap="10"></peek-grid>

      <!-- Inline detail view (replaces card grid when an entity is selected) -->
      <div class="detail-view" id="detailView" style="display: none;">
        <div class="detail-header">
          <span class="detail-type-icon" id="detailTypeIcon"></span>
          <div class="detail-header-info">
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-subtitle" id="detailSubtitle"></div>
          </div>
        </div>

        <div class="detail-section">
          <label class="detail-label">Attributes</label>
          <div class="detail-attributes" id="detailAttributes"></div>
        </div>

        <div class="detail-section" id="detailAliasesSection" style="display: none;">
          <label class="detail-label">Also Known As</label>
          <div class="detail-aliases" id="detailAliases"></div>
        </div>

        <div class="detail-section">
          <label class="detail-label">Extraction Info</label>
          <div class="detail-extraction-info" id="detailExtractionInfo"></div>
        </div>

        <div class="detail-section">
          <label class="detail-label">Feedback</label>
          <div id="detailFeedback"></div>
        </div>

        <div class="detail-section">
          <label class="detail-label">Source Pages</label>
          <div class="detail-sources" id="detailSources"></div>
        </div>
      </div>
    </div>

    <script type="module" src="home.js"></script>
  </body>
</html>
