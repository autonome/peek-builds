[package]
name = "peek-core"
version = "0.1.0"
description = "Shared database and business logic for Peek (iOS, Android, desktop)"
authors = ["dietrich"]
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
url = "2"
regex = "1"
base64 = "0.22"
readability-rust = "0.1"
sha2 = "0.10"
thiserror = "2"
uniffi = { version = "0.28", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
